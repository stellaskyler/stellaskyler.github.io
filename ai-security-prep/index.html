stem":"A multinational client launches one AI recruitment workflow in several countries. What compliance architecture is most defensible?","choices":[{"text":"Map each nation's rules to the actual use case","why":"A global baseline needs scoped legal overlays"},{"text":"Assume US employment practices satisfy all regions","why":"Local rules differ"},{"text":"Handle every obligation only through the system prompt","why":"Legal duties often require operational controls and rights"},{"text":"Ignore vendor roles because one team built the app","why":"Provider and deployer roles may carry different duties"}],"takeaway":"Design jurisdiction-aware governance without presuming one universal rule.","source":"nist"},{"id":"ae4048efb547","domain":"Legal, regulatory and contractual risk","level":"D","stem":"An institution processes student data in an AI advisor. Which design best handles FERPA-sensitive workflows?","choices":[{"text":"Define who may use the data, why and with whom","why":"Authorization and contractual context are central"},{"text":"Rely on an LLM vendor's generic HIPAA statement","why":"A different regulatory regime is at issue"},{"text":"Make all student records searchable to every faculty member","why":"Broad access conflicts with legitimate-purpose limits"},{"text":"Assume student consent is always the only legal basis","why":"Applicability and exceptions require analysis"}],"takeaway":"Connect student-data access to legitimate institutional roles and agreements.","source":"nist"},{"id":"3d507a61e029","domain":"Legal, regulatory and contractual risk","level":"V","stem":"A contract promises 'no customer data training' but is silent on debugging access and retention. What redline is most valuable?","choices":[{"text":"Set limits on access, storage and notice for each feature","why":"Training restriction is only one lifecycle element"},{"text":"Remove the phrase 'artificial intelligence' from the contract","why":"Vocabulary doesn't resolve risk"},{"text":"Mandate deletion of customer prompts at session end only","why":"It misses human debugging access, subprocessors and other retained data"},{"text":"Require a public benchmark score instead of operational terms","why":"Performance doesn't define data obligations"}],"takeaway":"Translate business data expectations into testable service commitments.","source":"nist"},{"id":"3fd4631bba3a","domain":"Legal, regulatory and contractual risk","level":"V","stem":"A client needs a go/no-go decision but relevant AI regulations are evolving. What is the strongest deliverable?","choices":[{"text":"A dated map of legal duties, owners and review triggers","why":"Decisions need current scope and change mechanisms"},{"text":"Document only enacted regulations and postpone controls for any pending requirements","why":"Current obligations matter, but evolving exposure still merits decision triggers and risk management."},{"text":"Apply a globally strictest-regulation control baseline to every use case","why":"A maximal baseline may ignore applicability, conflict across jurisdictions and operational proportionality."},{"text":"Ask the technical team to sign off once counsel provides a list of regulation titles","why":"Titles alone do not map duties to roles, processing activities or acceptance evidence."}],"takeaway":"Distinguish verified law, guidance, contractual commitments and assumptions.","source":"nist"},{"id":"055c08e50d8b","domain":"Vendor and product assurance","level":"E","stem":"A product calls itself 'AI private' because it doesn't train on user data. Why is that incomplete?","choices":[{"text":"Processing location, retention, support access and logging can still expose data","why":"Training exclusion is only one control dimension"},{"text":"Private inference endpoints prevent prompt inspection by support and operations personnel","why":"Private networking does not determine logging, support access or provider subprocessors."},{"text":"A no-training promise removes the need for a data-processing agreement","why":"Training use is only one processing purpose; retention, disclosure and deletion still matter."},{"text":"Privacy can be established solely through enterprise identity federation","why":"Federation governs authentication but not the full lifecycle of submitted information."}],"takeaway":"Evaluate service features and actual processing paths.","source":"nist"},{"id":"3bf7522f8f9d","domain":"Vendor and product assurance","level":"E","stem":"What does a generic SOC 2 Type II report NOT automatically establish?","choices":[{"text":"Whether specific AI features and subprocessors were audited","why":"Assurance boundaries and exceptions matter"},{"text":"That controls were observed over a period for the stated scope","why":"That is the core of Type II assurance"},{"text":"That auditors reviewed some defined criteria","why":"They do assess the stated controls"},{"text":"That the provider documented a system description","why":"The report includes scope information"}],"takeaway":"Read the report's exact service scope and carve-outs.","source":"nist"},{"id":"3c4a63411afa","domain":"Vendor and product assurance","level":"A","stem":"Two AI vendors have similar ratings but one offers no model-change notice. Which risk deserves attention?","choices":[{"text":"Model updates can void prior tests without notice","why":"Change rights and transparency affect ongoing assurance"},{"text":"The vendor's headline accuracy advantage on public benchmarks","why":"Accuracy alone does not address lifecycle and change transparency"},{"text":"A minor difference in leaderboard rank only","why":"The workflow's security gates may be more important"},{"text":"The number of employees listed on the vendor homepage","why":"Not a direct technical assurance signal"}],"takeaway":"Assess lifecycle control, not only snapshot quality.","source":"nist"},{"id":"899e5aa56f88","domain":"Vendor and product assurance","level":"A","stem":"A vendor says its RAG solution is 'permission-aware,' but its evaluation used one admin account. What's the evidence gap?","choices":[{"text":"They never tested what other user roles may retrieve","why":"An admin can access content that ordinary users cannot"},{"text":"No proof that documents are ranked with high semantic relevance","why":"Search relevance cannot establish source entitlement"},{"text":"No benchmark for ranking recall on unrestricted documents","why":"Ranking relevance alone does not demonstrate permissions"},{"text":"No test of final-answer filtering of forbidden content","why":"Output filtering cannot replace retrieval-time ACL enforcement"}],"takeaway":"Demand cross-role, cross-tenant and permission-revocation testing.","source":"nist"},{"id":"dd8bd182f6a7","domain":"Vendor and product assurance","level":"D","stem":"A client wants to approve embedded AI features in existing SaaS. Which inventory granularity is right?","choices":[{"text":"Inventory each feature by data flows and available actions","why":"Vendor approval is not blanket feature approval"},{"text":"Approve every future feature based on the SaaS brand","why":"New capabilities can change exposure"},{"text":"Require an entirely new procurement process for every UI tooltip","why":"Risk-based scoping is more efficient"},{"text":"Only inventory foundation model names","why":"Features differ by workflow and integration"}],"takeaway":"Treat AI supplier assurance as feature- and configuration-specific.","source":"nist"},{"id":"7711ba9d9658","domain":"Vendor and product assurance","level":"D","stem":"An organization will compare three AI security gateways. Which proof-of-value is most meaningful?","choices":[{"text":"Compare realistic traffic, attack paths, privacy and latency","why":"Evaluation should reflect local integrations and failure costs"},{"text":"Choose the vendor with most blocked demo prompts","why":"Counts can be gamed and omit false positives"},{"text":"Choose the lowest false-negative rate on the vendor's own test set","why":"Different test conditions and false-positive costs undermine comparison"},{"text":"Ask each vendor to score itself with its preferred dataset","why":"Incomparable tests cannot rank products"}],"takeaway":"Use neutral, reproducible, risk-weighted test conditions.","source":"nist"},{"id":"0b0a8e4996da","domain":"Vendor and product assurance","level":"V","stem":"A CAIO wants a two-page AI supplier risk decision. What must it include?","choices":[{"text":"Use case, residual risk and accountable owner","why":"A decision must constrain actual use and document uncertainty"},{"text":"A list of every vendor award","why":"Awards aren't implementation controls"},{"text":"Only a broad 'approved' or 'denied' label","why":"Conditions and scope are needed"},{"text":"A generic security questionnaire with no interpretation","why":"Answers need consequence and control mapping"}],"takeaway":"Make approval conditional on a concrete deployment profile.","source":"nist"},{"id":"40d306361e27","domain":"Vendor and product assurance","level":"V","stem":"A vendor refuses to disclose its underlying model provider. How should the issue be framed?","choices":[{"text":"Missing model origins and upstream vendor due diligence","why":"Non-disclosure may limit verification but isn't automatic proof of compromise"},{"text":"Accept the supplier's independent security audit as sufficient evidence of AI subcontractor governance","why":"Generic audits may not cover model provenance, processing rights or specific subcontractor flows."},{"text":"Require contractual indemnification for undisclosed model dependencies and proceed","why":"Financial remedies do not substitute for understanding data handling and security controls."},{"text":"Insist on the proprietary model name but make no further inquiries once disclosed","why":"A name is useful provenance, not proof of service security or lawful processing."}],"takeaway":"Differentiate unacceptable risk, compensating evidence and residual unknowns.","source":"nist"},{"id":"b6dd39a84dfe","domain":"Cloud AI security architecture","level":"E","stem":"An Azure AI application uses managed identity but its storage role is Contributor for the entire subscription. What is the issue?","choices":[{"text":"Workload identity exists, but effective authorization remains excessive","why":"Managed identities do not automatically provide least privilege"},{"text":"A managed identity cannot access storage outside the resource group where it was created","why":"Managed identities can receive authorizations at broader scopes; scope and assigned role govern reach."},{"text":"The role should be Contributor only if the application uses private endpoints","why":"Network reachability and IAM privilege are separate controls."},{"text":"The role is safe because token rotation is handled automatically by Azure","why":"Automatic credential management does not make excessive privileges appropriate."}],"takeaway":"Scope access to required resources and operations.","source":"nist"},{"id":"66fe9fa21818","domain":"Cloud AI security architecture","level":"E","stem":"Why can an AI deployment have a private endpoint and still expose sensitive prompts externally?","choices":[{"text":"Other telemetry, support or processing flows can expose prompts","why":"One network control does not describe full data residency"},{"text":"Private endpoints automatically cover every subservice","why":"Coverage varies"},{"text":"All private endpoints permit unrestricted internet ingress","why":"They can restrict specific connections"},{"text":"Prompt privacy is guaranteed by HTTPS alone","why":"TLS doesn't define authorized recipients"}],"takeaway":"Map control and data planes plus outbound dependencies.","source":"nist"},{"id":"9375adbeae46","domain":"Cloud AI security architecture","level":"A","stem":"A cloud AI service is configured with public network access disabled but an agent still sends data to web search. What's the likely boundary gap?","choices":[{"text":"Unrestricted tool egress despite private model ingress","why":"Different services have different network policies"},{"text":"Disabling inbound access must disable every outbound app call","why":"Ingress and egress differ"},{"text":"Private endpoints cannot coexist with external tools","why":"They can coexist"},{"text":"The data must have leaked from training","why":"A runtime tool can transmit it"}],"takeaway":"Follow the full integration path across services.","source":"nist"},{"id":"576a57ce22ff","domain":"Cloud AI security architecture","level":"A","stem":"An Azure-hosted RAG assistant can read a SharePoint document that was just locked down. Where do you inspect first?","choices":[{"text":"Check ACL sync and retrieval-time permissions","why":"Stale permissions can survive in derived stores"},{"text":"Only the model's ability to cite the source document","why":"Citations do not prove whether access was reauthorized at retrieval time"},{"text":"The number of Azure regions","why":"Not the direct permission mechanism"},{"text":"The UI branding of Microsoft 365","why":"Not relevant to source rights"}],"takeaway":"Verify where source ACL decisions are enforced during retrieval.","source":"nist"},{"id":"e0a878852ac1","domain":"Cloud AI security architecture","level":"D","stem":"You are designing a production agent in Azure with privileged operations. Which pattern is strongest?","choices":[{"text":"Scope the identity and tools, then gate each risky action","why":"Cloud-native controls can enforce resource boundaries"},{"text":"Put global admin credentials in Key Vault and let the LLM retrieve them","why":"Secret storage doesn't justify broad authority"},{"text":"Use a single system prompt as the authorization policy","why":"Prompt-only policy is insufficient"},{"text":"Allow all outbound internet so the agent can recover autonomously","why":"Unrestricted egress widens risk"}],"takeaway":"Protect tool execution with identity, network and business rules.","source":"nist"},{"id":"90ce4db9369b","domain":"Cloud AI security architecture","level":"D","stem":"A hybrid AI application spans AWS and Azure and processes sensitive documents. What should the security architecture centralize?","choices":[{"text":"Unified identity, data flows and control evidence","why":"Consistent risk invariants matter across provider-specific implementations"},{"text":"Exactly the same cloud IAM syntax in both providers","why":"Providers expose different authorization models"},{"text":"A single public API key shared by both clouds","why":"Shared secrets increase blast radius"},{"text":"All documents in one giant prompt","why":"This does not establish access controls"}],"takeaway":"Standardize control outcomes while using native enforcement per cloud.","source":"nist"},{"id":"f6919fc15bbe","domain":"Cloud AI security architecture","level":"V","stem":"A client asks whether Azure AI content safety settings alone meet its risk appetite. What's the correct test?","choices":[{"text":"Test leaks, refusals and tool actions in real workflows","why":"A platform feature covers only some system threats"},{"text":"Accept provider-level certification without validating the deployed integration","why":"Provider assurance does not establish app-level security"},{"text":"Turn every filter to maximum regardless of workflow impact","why":"Overblocking may undermine operations"},{"text":"Disable app logs and trust the managed service","why":"That weakens incident evidence"}],"takeaway":"Test platform controls in the workflow and state residual gaps.","source":"nist"},{"id":"89d5d86b7e1b","domain":"Cloud AI security architecture","level":"V","stem":"A new cloud AI feature is announced as 'generally available.' Does that establish enterprise readiness?","choices":[{"text":"No, verify region, contractual scope, identity support, logging, data handling and operational controls","why":"GA is a lifecycle label, not a security acceptance"},{"text":"Treat GA status as approval for pilot workloads only, with production gated solely on performance tests","why":"GA does not establish required identity, residency, legal or audit scope even for constrained pilots."},{"text":"Rely on the service's published compliance certificates and omit tenant configuration review","why":"Provider attestations do not validate customer-side settings or feature-specific scope."},{"text":"Approve the deployment if the feature is available in the primary cloud region","why":"Availability does not prove approved processing paths, model deployment controls or monitoring."}],"takeaway":"Gate platform features using deployment-specific requirements.","source":"nist"},{"id":"1dc6ef5d5504","domain":"Consulting delivery and architecture reviews","level":"E","stem":"A client asks for an AI security assessment but provides only vendor names. What information is essential first?","choices":[{"text":"Use cases, data classes, actions, principals and business consequences","why":"Risk follows the workflow, not only the product catalog"},{"text":"Collect model versions and endpoint specifications so the team can compare vendor baseline security","why":"Useful component data, but it does not define the client-specific action paths or blast radius."},{"text":"Issue a standardized questionnaire immediately and accept its controls as assessment scope","why":"Questionnaires help evidence collection but do not establish the system's actual data and tool use."},{"text":"Start penetration testing the UI because technical findings are more concrete than discovery","why":"Testing without use-case boundaries risks low relevance and missing high-impact flows."}],"takeaway":"Start with business workflows and effective authority.","source":"nist"},{"id":"a87411cd9dc3","domain":"Consulting delivery and architecture reviews","level":"E","stem":"What is a useful distinction between an architecture recommendation and an implementation-ready requirement?","choices":[{"text":"Enforceable conditions with owners and verification criteria","why":"Ideas become deliverable when someone can build and test them"},{"text":"Requirements should intentionally omit acceptance tests","why":"That makes completion ambiguous"},{"text":"Recommendations must always mention a vendor SKU","why":"Many are vendor-neutral"},{"text":"Architecture diagrams are sufficient to prove compliance","why":"Deployment evidence is separate"}],"takeaway":"Translate desired controls into measurable acceptance criteria.","source":"nist"},{"id":"bb039bfac766","domain":"Consulting delivery and architecture reviews","level":"A","stem":"A client has little security buy-in and no AI inventory. What first engagement scope is most likely to succeed?","choices":[{"text":"A focused discovery and prioritized remediation sprint","why":"A narrow, useful outcome can build trust and visibility"},{"text":"A twelve-month governance rewrite before any quick wins","why":"May stall and lack ownership"},{"text":"An immediate purchase of every AI security platform","why":"Tools do not replace discovery"},{"text":"A large red-team campaign without knowing systems","why":"Scope and value would be unclear"}],"takeaway":"Sequence visibility and specific control wins before platform complexity.","source":"nist"},{"id":"97bf7eedcbca","domain":"Consulting delivery and architecture reviews","level":"A","stem":"A vendor demos a policy-as-code engine, but the client has no stable rules or enforcement owners. What's the main delivery risk?","choices":[{"text":"Unclear rules will make the automation fail","why":"Policy-as-code needs clear decisions and integration points"},{"text":"Policy-as-code is categorically worse than written policy","why":"It can help at sufficient maturity"},{"text":"The client must first deploy Kubernetes everywhere","why":"Not always necessary"},{"text":"More YAML will automatically solve ownership","why":"Code cannot decide accountability"}],"takeaway":"Clarify policy, native control coverage and integration before custom automation.","source":"nist"},{"id":"c32d36441b52","domain":"Consulting delivery and architecture reviews","level":"D","stem":"A security team has two reviewers for hundreds of AI requests. What operating model is most useful?","choices":[{"text":"Approved patterns with automated evidence and tiered exceptions","why":"Routine cases should not consume expert review"},{"text":"Require a deep bespoke review of every low-risk prompt","why":"It will not scale"},{"text":"Grant all developers indefinite exceptions","why":"Risk becomes unmanaged"},{"text":"Build a new portal before defining decisions","why":"Workflow should drive tooling"}],"takeaway":"Reserve human expertise for boundary changes and consequential exceptions.","source":"nist"},{"id":"25d64901f301","domain":"Consulting delivery and architecture reviews","level":"D","stem":"You must deliver a secure agent architecture in six weeks. Which work breakdown has the strongest sequencing?","choices":[{"text":"Discover boundaries, design controls, pilot, test and operationalize","why":"Evidence and operability must be built into delivery"},{"text":"Start with a comprehensive governance policy before tracing tool permissions","why":"Policy drafting can delay foundational technical decisions"},{"text":"Implement every possible agent capability before scoping risk","why":"Capability sprawl harms schedule and security"},{"text":"Defer identity decisions until after go-live","why":"Authorization is foundational"}],"takeaway":"Sequence implementation around a small end-to-end validated workflow.","source":"nist"},{"id":"53cbe0e8b940","domain":"Consulting delivery and architecture reviews","level":"V","stem":"A sponsor says 'we need a roadmap, not another assessment.' What makes a roadmap credible?","choices":[{"text":"A plan with clear owners, order and tests","why":"Roadmaps should guide feasible execution"},{"text":"A list of maturity adjectives without sequencing","why":"Labels do not drive actions"},{"text":"A target architecture with no transition states","why":"Clients need migration paths"},{"text":"A spending estimate without controls or outcomes","why":"Cost alone doesn't establish value"}],"takeaway":"Deliver a path from current exposure to verified control outcomes.","source":"nist"},{"id":"dcf30ebe1994","domain":"Consulting delivery and architecture reviews","level":"V","stem":"A delivery team wants to claim 'continuous AI assurance' after installing a one-time scanner. What should you correct?","choices":[{"text":"Regular tests, logs, exceptions and people who act on results","why":"A one-time scan is a point-in-time assessment"},{"text":"Schedule the scanner nightly and report the number of findings as assurance coverage","why":"Recurring scans without owner response and continuous evidence do not establish assurance."},{"text":"Add a quarterly audit committee review of the initial scan result","why":"Oversight is useful but cannot substitute for current control validation across changes."},{"text":"Market the tool as continuous monitoring while disclosing that remediation remains manual","why":"A truthful manual response model is fine, but a one-time scanner is not continuous assurance."}],"takeaway":"State the service boundary and cadence precisely.","source":"nist"},{"id":"182629fdbfa6","domain":"Practice leadership and program economics","level":"E","stem":"A client measures AI security program success by number of tools deployed. What's the stronger outcome?","choices":[{"text":"Reduction in exploitable high-consequence paths and improved time to controlled adoption","why":"Tool deployment is an input, not risk reduction"},{"text":"Increase policy-training completion rates while maintaining the same technology inventory","why":"Training can improve awareness but does not demonstrate lower exploitable AI risk."},{"text":"Report average vendor security-assessment scores as the program's primary success indicator","why":"Supplier diligence is an input, not a measure of attack-path reduction or safe delivery speed."},{"text":"Maximize the count of approved AI projects to show the governance workflow is working","why":"Approval throughput does not by itself show that risky action paths were reduced."}],"takeaway":"Connect spending to risk and business enablement.","source":"nist"},{"id":"84665e1adc33","domain":"Practice leadership and program economics","level":"E","stem":"What distinguishes risk acceptance from risk remediation?","choices":[{"text":"Acceptance assigns residual risk; remediation reduces exposure","why":"Approval without an owner is not treatment"},{"text":"Acceptance automatically makes the system technically safe","why":"Exposure can remain"},{"text":"Remediation is any meeting where risk is discussed","why":"Action is required to change risk"},{"text":"Accepted risks no longer require monitoring","why":"Conditions can change"}],"takeaway":"Keep decisions about exposure explicit and time-bounded.","source":"nist"},{"id":"3e7a5c538eea","domain":"Practice leadership and program economics","level":"A","stem":"An AI security service line has many proposals but few implementations. Which diagnostic is most useful?","choices":[{"text":"Conversion and delivery unit economics","why":"Demand does not alone prove an executable offering"},{"text":"Increase the number of offering names","why":"More branding may worsen fragmentation"},{"text":"Assume clients simply lack maturity","why":"Supply and packaging may be flawed"},{"text":"Measure only proposal meeting attendance","why":"Interest counts do not prove conversion, repeatability or delivered value"}],"takeaway":"Diagnose where the offering fails from sale through delivery.","source":"nist"},{"id":"e4280cfe8332","domain":"Practice leadership and program economics","level":"A","stem":"A CISO wants to buy expensive AI runtime monitoring before securing tool identities. Which prioritization argument is strongest?","choices":[{"text":"Preventive identity scoping before relying on runtime detection","why":"Investment should consider control leverage and dependencies"},{"text":"Monitoring is useless in every architecture","why":"Detection remains important"},{"text":"Identity controls remove the need for incident response","why":"Residual risk remains"},{"text":"Choose based on which vendor offers the largest discount","why":"Cost matters but not by itself"}],"takeaway":"Prioritize breakpoints that most reduce expected consequence.","source":"nist"},{"id":"66a5f60ea279","domain":"Practice leadership and program economics","level":"D","stem":"You are productizing AI security architecture reviews for mid-market clients. What makes the delivery model scalable?","choices":[{"text":"Standardized intake, architectures, evidence checks and expert escalation","why":"Reusable artifacts reduce bespoke effort without hiding judgment"},{"text":"Promise every client an entirely new control framework","why":"That defeats reuse"},{"text":"Run the same generic model prompt for every environment with no validation","why":"Context and evidence still matter"},{"text":"Staff every review with five senior specialists","why":"Cost and throughput become prohibitive"}],"takeaway":"Standardize common pathways and reserve experts for material differences.","source":"nist"},{"id":"844d8b44fffc","domain":"Practice leadership and program economics","level":"D","stem":"A consulting practice is launching agent-security offerings. What is a sensible initial portfolio?","choices":[{"text":"Separate architecture, identity controls, testing and managed reviews","why":"These are complementary and implementable capability slices"},{"text":"Fifteen overlapping branded offerings without delivery playbooks","why":"Offerings become difficult to scope and sell"},{"text":"Only a compliance certification guarantee","why":"Unwarranted legal and assurance claims create risk"},{"text":"A product claiming to autonomously secure every agent","why":"Overpromises beyond evidence"}],"takeaway":"Define buyer, deliverable, acceptance and exclusions for each service.","source":"nist"},{"id":"4e5c06594187","domain":"Practice leadership and program economics","level":"V","stem":"A partner asks how much AI security work can be automated safely. What is the strongest division?","choices":[{"text":"Automate routine checks; reserve novel risks for experts","why":"Automation supports—not replaces—accountable judgment"},{"text":"Make the model final approver of every exception","why":"Risk ownership is not delegated to inference"},{"text":"Keep all low-risk paperwork manual","why":"This wastes scarce expertise"},{"text":"Automate based solely on which tasks have the most text","why":"Consequence and verifiability matter more"}],"takeaway":"Target repeatable verification while preserving human accountability.","source":"nist"},{"id":"6444ecdad245","domain":"Practice leadership and program economics","level":"V","stem":"An offering shows good revenue but requires rebuilding its controls for every client. What strategic conclusion follows?","choices":[{"text":"The work may be profitable consulting but is not yet a repeatable productized service","why":"Reusability and unit economics are separate from revenue"},{"text":"Increase implementation fees to recover the bespoke engineering expense","why":"Higher revenue does not make the delivery repeatable or scalable."},{"text":"Standardize the branding and contractual scope before investing in reusable implementation assets","why":"Packaging improves sales consistency but not the repeated engineering cost."},{"text":"Treat the revenue growth rate as sufficient proof and expand the sales force","why":"Revenue can increase despite worsening utilization, delivery margin or dependency on experts."}],"takeaway":"Measure reuse, delivery variance and realized margin before product claims.","source":"nist"},{"id":"a1544d0c5bf3","domain":"Data governance and classification","level":"E","stem":"A document is labeled 'Confidential' but can be retrieved by every employee's AI assistant. What distinction matters?","choices":[{"text":"Classification defines handling requirements; authorization determines who can access","why":"A sensitivity label alone may not restrict access"},{"text":"Use the classification label to prevent retrieval while leaving document permissions unchanged","why":"Labels can trigger enforcement policies, but a label alone does not guarantee object-level authorization."},{"text":"Apply a post-generation DLP rule to hide restricted document content from responses","why":"DLP can reduce leakage but cannot undo inappropriate retrieval into the model context."},{"text":"Rely on private model hosting because internal documents never leave the organization","why":"Private hosting does not prevent an overprivileged internal user or agent from accessing the document."}],"takeaway":"Map labels to actual access, processing and DLP controls.","source":"nist"},{"id":"120c23e9ec71","domain":"Data governance and classification","level":"E","stem":"A data inventory lists storage systems but not business purpose or information owner. What is missing for AI governance?","choices":[{"text":"Purpose, sensitivity, ownership and retention","why":"Asset locations alone do not determine acceptable AI use"},{"text":"A bigger cloud budget","why":"Spending is not governance metadata"},{"text":"A more colorful dashboard","why":"Presentation doesn't define permissible uses"},{"text":"A universal rule that every dataset is public","why":"Sensitivity varies"}],"takeaway":"Track both data location and business meaning.","source":"nist"},{"id":"c1c283b3fe17","domain":"Data governance and classification","level":"A","stem":"An M365 Copilot user sees a private salary spreadsheet via search. The file was broadly shared years ago. What's the primary issue?","choices":[{"text":"Source oversharing exposed salaries through Copilot","why":"Copilot may surface what the user can already access"},{"text":"The model necessarily bypassed Microsoft authentication","why":"Existing broad sharing can explain it"},{"text":"A PII detector must have disabled encryption","why":"No such inference follows"},{"text":"A prompt-only no-disclosure rule should have hidden the overshared document","why":"Prompt instructions do not repair underlying oversharing"}],"takeaway":"Remediate the permissions at the source and verify AI discovery paths.","source":"nist"},{"id":"98e2aead13f5","domain":"Data governance and classification","level":"A","stem":"A classification scanner marks nearly every document 'Highly Restricted,' leading teams to bypass it. What's the program failure?","choices":[{"text":"Poor precision and impractical workflows undermine control adoption and trust","why":"Classification quality and usability matter"},{"text":"The taxonomy has too many labels and should be reduced without validation","why":"Simplification may help but not without examining classifier calibration and impacts"},{"text":"The sensitivity taxonomy must be eliminated entirely","why":"Taxonomy can be tuned"},{"text":"More alerts will automatically improve outcomes","why":"Alert volume can worsen fatigue"}],"takeaway":"Use representative validation and human exception processes.","source":"nist"},{"id":"ec2d1bd52aa7","domain":"Data governance and classification","level":"D","stem":"You must define what information is acceptable for enterprise AI processing. Which structure is most operational?","choices":[{"text":"A matrix of what data AI can use and when","why":"Permission depends on both information and processing context"},{"text":"One blanket yes/no flag for all models","why":"Different features and contracts vary"},{"text":"A model prompt containing every data label","why":"Prompts are not enforcement"},{"text":"Only a vendor list without use-case restrictions","why":"Approved vendors can have unsafe uses"}],"takeaway":"Express acceptable processing as conditional rules that can be tested.","source":"nist"},{"id":"8535769a5518","domain":"Data governance and classification","level":"D","stem":"A healthcare organization wants RAG over both public protocols and internal patient records. What design is strongest?","choices":[{"text":"Separate entitlements, minimized retrieval and audited record access","why":"Mixed sources require explicit authority and purpose"},{"text":"Place all documents in one unrestricted index for convenience","why":"Leaks become likely"},{"text":"Trust the assistant to recognize which records are private","why":"The model cannot be the sole policy gate"},{"text":"Suppress patient names after generation only","why":"The model may already have received sensitive records"}],"takeaway":"Enforce source permissions and processing scope before model input.","source":"nist"},{"id":"93c6e8c1a3e3","domain":"Data governance and classification","level":"V","stem":"A client asks whether data classification is ready for Copilot rollout. What evidence should you show?","choices":[{"text":"Label accuracy, coverage and oversharing tests","why":"Labels are useful only when accurate and connected to controls"},{"text":"Count of created labels alone","why":"Taxonomy does not prove implementation"},{"text":"Whether employees know the word 'confidential'","why":"Awareness isn't effective access control"},{"text":"A generic provider compliance badge without the tenant's permission audit","why":"Supplier controls do not establish internal data-readiness"}],"takeaway":"Make readiness a measurable data-and-permissions assessment.","source":"nist"},{"id":"45b5c469d96f","domain":"Data governance and classification","level":"V","stem":"An AI project requests an exception to process restricted information in a novel vendor tool. What decision package is most defensible?","choices":[{"text":"Data purpose, flow, contract terms, safeguards, alternatives, residual risk owner and expiry","why":"Exceptions must be scoped and justified"},{"text":"Approve a time-boxed pilot based on data masking and vendor encryption without contract review","why":"Technical controls may not address retention, subprocessors or acceptable purpose."},{"text":"Request a manager signature and a model card, then treat the exception as low risk","why":"Neither provides full data flow, enforceable protections or residual-risk acceptance."},{"text":"Reject the request outright based on the restricted classification, regardless of options","why":"Classification may create strict requirements, but a defensible decision evaluates allowed mitigations and alternatives."}],"takeaway":"Connect sensitivity to actual processing controls and accountable exceptions.","source":"nist"}];
const SOURCES={nist:{name:'NIST AI Risk Management Framework',url:'https://www.nist.gov/itl/ai-risk-management-framework'},owasp:{name:'OWASP GenAI LLM Top 10 (2026)',url:'https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/'},atlas:{name:'MITRE ATLAS',url:'https://atlas.mitre.org/'},mcp:{name:'MCP authorization security considerations',url:'https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/specification/2026-07-28/basic/authorization/security-considerations.mdx'}};
const LEVEL={E:'Explain',A:'Assess',D:'Design',V:'Deliver'};
const KEY='ai_security_prep_v1';
const D=Array.from(new Set(BANK.map(q=>q.domain)));
let tab='home',cfg={mode:'smart',count:20,levels:['E','A','D','V'],domains:[],timed:false},state=load();
function fresh(){return{version:1,created:Date.now(),history:{},bookmarks:[],session:null,recent:[],finished:null,settings:{}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===1&&x.history?x:fresh()}catch{return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Local storage unavailable. Export progress regularly.')}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.style.display='none',3000)}
function stats(q){return state.history[q.id]||{attempts:[],ease:2.5,due:0,streak:0}}
function last(q){let x=stats(q).attempts;return x.length?x[x.length-1]:null}
function tried(q){return stats(q).attempts.length>0}
function due(q){return tried(q)&&stats(q).due<=Date.now()}
function mastery(q){let a=stats(q);if(!a.attempts.length)return 0;let last=a.attempts.slice(-3);return Math.round(100*last.reduce((n,z)=>n+(z.correct?1:0),0)/last.length)}
function allStats(){let seen=BANK.filter(tried);let correct=seen.filter(q=>last(q)?.correct);let duecount=BANK.filter(due).length;let total=Object.values(state.history).reduce((n,x)=>n+(x.attempts?.length||0),0);return{seen:seen.length,correct:correct.length,due:duecount,attempts:total,rate:seen.length?Math.round(correct.length/seen.length*100):0}}
function userDays(){let set=new Set();for(let a of Object.values(state.history)){for(let x of (a.attempts||[]))set.add(new Date(x.t).toLocaleDateString('en-CA'))}let run=0,day=new Date();for(let i=0;i<90;i++){let date=day.toLocaleDateString('en-CA');if(set.has(date))run++;else if(i!==0)break;day.setDate(day.getDate()-1)}return run}
function levelStat(l){let qs=BANK.filter(q=>q.level===l);let s=qs.filter(tried);return{seen:s.length,total:qs.length,rate:s.length?Math.round(s.filter(q=>last(q)?.correct).length/s.length*100):null}}
function domainStat(d){let qs=BANK.filter(q=>q.domain===d);let s=qs.filter(tried);return{seen:s.length,total:qs.length,rate:s.length?Math.round(s.filter(q=>last(q)?.correct).length/s.length*100):null}}
function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['practice','▦','Practice'],['review','↺','Review'],['stats','▥','Progress']].map(([id,ico,label])=>`<button class="navbutton ${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}" onclick="go('${id}')"><span class="ico" aria-hidden="true">${ico}</span>${label}</button>`).join('')}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){nav();const app=document.getElementById('app');app.innerHTML=({home:home,practice:practice,review:review,stats:progress,quiz:quiz,finish:finish,results:results}[tab]||home)()}
function home(){let s=allStats(),l=['E','A','D','V'];return `<section class="hero"><div class="eyebrow">AI security mastery</div><h1>Go beyond <span class="accent">memorizing frameworks.</span></h1><p>224 case-based questions across 28 domains. Choose the best control, assess the attack path, and learn why the tempting alternatives fail.</p><div class="btnrow">${state.session?'<button class="btn" onclick="resume()">Resume session</button>':'<button class="btn" onclick="go(\'practice\')">Start practice</button>'}<button class="btn secondary" onclick="quickStart()">20-question mixed quiz</button></div></section><div class="sectionhead"><h2>Your progress</h2><span class="small muted">Saved on this device</span></div><div class="grid"><div class="metric"><strong>${s.seen}<span style="font-size:13px;color:#9ebbcf"> / 224</span></strong><span>Questions seen</span></div><div class="metric"><strong>${s.seen?s.rate+'%':'—'}</strong><span>Latest accuracy</span></div><div class="metric"><strong>${s.due}</strong><span>Due for review</span></div></div><div class="sectionhead"><h2>Four levels of competence</h2><button class="link" onclick="go('stats')">View all domains</button></div><div class="two">${l.map(x=>{let o=levelStat(x);return `<div class="panel" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center"><b>${LEVEL[x]}</b><span class="muted small">${o.seen} / ${o.total}</span></div><div class="bar"><i style="width:${Math.round(o.seen/o.total*100)}%"></i></div><p class="small" style="margin-bottom:0">${{E:'Explain mechanics precisely.',A:'Diagnose evidence and tradeoffs.',D:'Design enforceable architecture.',V:'Deliver defensible client decisions.'}[x]}</p></div>`}).join('')}</div><div class="sectionhead"><h2>Study modes</h2></div><div class="two"><div class="panel"><h3>Adaptive review</h3><p class="small">Prioritize missed and due items, without repeating recent successes.</p><button class="btn secondary sm" onclick="setMode('smart')">Study now</button></div><div class="panel"><h3>Exam simulation</h3><p class="small">20 questions, optional timer, explanations after submission.</p><button class="btn secondary sm" onclick="examStart()">Start exam</button></div></div><p class="footnote">Offline-capable as a standalone HTML file. Local browser storage is device-specific. Export progress to move it between browsers.</p>`}
function setMode(m){cfg.mode=m;go('practice')}
function quickStart(){cfg={...cfg,mode:'smart',count:20,levels:['E','A','D','V'],domains:[],timed:false};start(false)}
function examStart(){cfg={...cfg,mode:'smart',count:20,levels:['E','A','D','V'],domains:[],timed:true};start(true)}
function practice(){let counts=['smart','unseen','missed','due','bookmarks','all'].map((m,i)=>{let labels=['Smart mix','Unseen','Previously missed','Due today','Bookmarked','All questions'];return `<button class="chip" aria-pressed="${cfg.mode===m}" onclick="chooseMode('${m}')">${labels[i]}</button>`}).join('');let levelchips=['E','A','D','V'].map(l=>`<button class="chip" aria-pressed="${cfg.levels.includes(l)}" onclick="toggleLevel('${l}')">${LEVEL[l]}</button>`).join('');return `<div class="eyebrow">Build your session</div><h1 style="margin:7px 0 4px">Practice setup</h1><p class="muted">All 28 domains are included unless you select specific ones.</p>${state.session?`<div class="notice">You have a session in progress. <button class="link" onclick="resume()">Resume it</button></div>`:''}<div class="panel"><h3>Choose the question pool</h3><div class="chips">${counts}</div><div class="hline"></div><h3>Difficulty levels</h3><div class="chips">${levelchips}</div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">Domains</h3><button class="btn sm ghost" onclick="fourDomain()">Four-domain rotation</button></div><p class="small">Select any subset or leave all unchecked to mix the full curriculum.</p><div class="btnrow" style="margin-bottom:12px"><button class="link" onclick="setAllDomains(false)">All 28 domains</button><button class="link" onclick="setAllDomains(true)">Select all</button></div><div class="selectbox">${D.map((d,i)=>`<label class="dom"><input type="checkbox" ${cfg.domains.includes(d)?'checked':''} onchange="toggleDomain(${i})"><span>${esc(d)}</span></label>`).join('')}</div></div><div class="panel"><h3>Session length</h3><div class="chips">${[10,20,40,224].map(n=>`<button class="chip" aria-pressed="${cfg.count===n}" onclick="chooseCount(${n})">${n===224?'All available':n+' questions'}</button>`).join('')}</div><div class="field" style="margin:16px 0 0"><label class="dom" style="background:transparent;border:0;padding:0"><input type="checkbox" ${cfg.timed?'checked':''} onchange="toggleTimed(this.checked)">Timed exam mode (no immediate feedback)</label></div></div><div class="btnrow"><button class="btn wide" onclick="start(cfg.timed)">Start session</button></div><div class="footnote">Selection and order are randomized per session. Scores for previously answered questions remain in your review history.</div>`}
function chooseMode(m){cfg.mode=m;render()}
function chooseCount(n){cfg.count=n;render()}
function toggleTimed(v){cfg.timed=v;render()}
function toggleLevel(l){cfg.levels=cfg.levels.includes(l)?cfg.levels.filter(x=>x!==l):[...cfg.levels,l];if(!cfg.levels.length)cfg.levels=[l];render()}
function toggleDomain(i){let d=D[i];cfg.domains=cfg.domains.includes(d)?cfg.domains.filter(x=>x!==d):[...cfg.domains,d];render()}
function setAllDomains(v){cfg.domains=v?[...D]:[];render()}
function fourDomain(){let ds=[...D].sort((a,b)=>{let x=domainStat(a),y=domainStat(b);return (x.seen?x.rate:0)-(y.seen?y.rate:0) || x.seen-y.seen});cfg.domains=ds.slice(0,4);cfg.count=20;render();toast('Four lowest-coverage / weakest domains selected')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){let a=BANK.filter(q=>cfg.levels.includes(q.level)&&(!cfg.domains.length||cfg.domains.includes(q.domain)));if(cfg.mode==='unseen')a=a.filter(q=>!tried(q));if(cfg.mode==='missed')a=a.filter(q=>tried(q)&&!last(q).correct);if(cfg.mode==='due')a=a.filter(due);if(cfg.mode==='bookmarks')a=a.filter(q=>state.bookmarks.includes(q.id));return a}
function start(exam){let a=pool();if(!a.length){toast('No questions match this selection. Try another mode or domain.');return}a=shuffle(a);if(cfg.mode==='smart')a.sort((x,y)=>{function rank(q){let st=stats(q);if(!tried(q))return 2+Math.random()*.8;if(!last(q).correct)return 0+Math.random()*.8;if(due(q))return 1+Math.random()*.8;return 3+Math.random()*.8}return rank(x)-rank(y)});let ids=a.slice(0,Math.min(cfg.count,a.length)).map(q=>q.id),orders={};for(let id of ids)orders[id]=shuffle([0,1,2,3]);state.session={ids,index:0,orders,answers:{},exam:!!exam,started:Date.now(),deadline:exam?Date.now()+ids.length*90000:null,done:false,config:{...cfg},selected:null,revealed:false};state.finished=null;save();go('quiz')}
function resume(){if(!state.session){go('home');return}go('quiz')}
function current(){let s=state.session;if(!s)return null;return BANK.find(q=>q.id===s.ids[s.index])}
function choose(c){let s=state.session;if(!s||s.revealed||s.answers[s.ids[s.index]])return;s.selected=c;save();render()}
function record(q,choice){const h=state.history[q.id]||{attempts:[],ease:2.5,due:0,streak:0};let ok=choice===0,now=Date.now();h.attempts.push({t:now,correct:ok,choice});h.attempts=h.attempts.slice(-50);h.streak=ok?(h.streak||0)+1:0;h.ease=Math.min(3,Math.max(1.3,(h.ease||2.5)+(ok?.08:-.25)));let days=ok?(h.streak===1?1:h.streak===2?3:Math.round((h.streak-1)*h.ease*2)):0;h.due=now+days*86400000;state.history[q.id]=h;state.recent.push({id:q.id,t:now,correct:ok});state.recent=state.recent.slice(-500)}
function answer(){let s=state.session,q=current();if(!s||!q||s.selected===null)return;let id=q.id;if(!s.answers[id]){record(q,s.selected);s.answers[id]={choice:s.selected,correct:s.selected===0,t:Date.now()}}s.revealed=!s.exam;s.selected=null;save();if(s.exam)next();else render()}
function next(){let s=state.session;if(!s)return;s.index++;s.selected=null;s.revealed=false;if(s.index>=s.ids.length){finishSession()}else{save();go('quiz')}}
function skip(){let s=state.session;if(!s||s.ids.length<=1||s.revealed)return;let id=s.ids.splice(s.index,1)[0];s.ids.push(id);s.selected=null;save();render();toast('Question moved to the end')}
function finishSession(){const s=state.session;if(!s)return;let answers=Object.values(s.answers),ok=answers.filter(x=>x.correct).length;state.finished={...s,score:ok,total:s.exam?s.ids.length:answers.length,completed:Date.now()};state.session=null;save();go('finish')}
function abandon(){if(!state.session)return;if(!confirm('End this session? Answered questions will remain in your history.'))return;finishSession()}
function toggleBookmark(id){let a=state.bookmarks;state.bookmarks=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()}
function answerBlock(q,selected,examReview){const good=selected===0;const choices=examReview?state.finished.orders[q.id]:state.session.orders[q.id];return `<div class="answer ${good?'good':'bad'}"><div class="eyebrow">${good?'Correct':'Best answer and reasoning'}</div><h3>${esc(q.choices[0].text)}</h3><div class="detail">${esc(q.choices[0].why)}</div><div class="notice" style="margin:14px 0">${esc(q.takeaway)}</div><h3 style="font-size:14px;margin-top:19px">Why each choice holds or fails</h3>${choices.map((ix,pos)=>{let c=q.choices[ix];return `<div class="choicewhy"><div><b>${'ABCD'[pos]} · ${ix===0?'Best answer':'Not the best choice'}${selected===ix?' · Your answer':''}</b></div><p>${esc(c.text)}</p><p style="color:${ix===0?'#a0e8ca':'#e2bcb4'}">${esc(c.why)}</p></div>`}).join('')}<div style="margin-top:16px"><div class="eyebrow">Further reading</div>${[SOURCES[q.source],SOURCES.nist].filter((v,i,a)=>v&&a.findIndex(x=>x.url===v.url)===i).map(s=>`<a class="ref" target="_blank" rel="noopener noreferrer" href="${s.url}">${esc(s.name)} ↗</a>`).join('')}</div></div>`}
function quiz(){let s=state.session;if(!s)return `<div class="empty"><h3>No active session</h3><button class="btn" onclick="go('practice')">Set up practice</button></div>`;let q=current();if(!q)return '';let ans=s.answers[q.id],order=s.orders[q.id],count=Object.keys(s.answers).length;let pct=Math.round(count/s.ids.length*100);let elapsed=Math.round((Date.now()-s.started)/60000);let countdown=s.exam?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):null;return `<div class="qwrap"><div class="qhead"><span>${s.exam?'EXAM MODE':'PRACTICE MODE'} · ${esc(q.domain)} · ${LEVEL[q.level]}</span><span>${s.index+1} / ${s.ids.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="qhead"><span>${count} answered · ${pct}% complete</span><span>${s.exam?`<span id="clock">${Math.floor(countdown/60)}:${String(countdown%60).padStart(2,'0')}</span> left · Review after finish`:'Detailed feedback after each question'} · ${elapsed} min</span></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Choose the single best answer</span><button class="book ${state.bookmarks.includes(q.id)?'marked':''}" title="${state.bookmarks.includes(q.id)?'Remove bookmark':'Bookmark question'}" aria-label="Bookmark question" onclick="toggleBookmark('${q.id}')">${state.bookmarks.includes(q.id)?'★':'☆'}</button></div><h2 class="qtitle">${esc(q.stem)}</h2>${order.map((ix,pos)=>{let c=q.choices[ix],sel=(s.revealed?ans?.choice:s.selected)===ix;let status=s.revealed?(ix===0?'correct':sel?'incorrect':''):sel?'selected':'';return `<button class="option ${status}" ${s.revealed?'disabled':''} aria-pressed="${sel}" onclick="choose(${ix})"><span class="letter">${'ABCD'[pos]}</span><span>${esc(c.text)}</span></button>`}).join('')}${s.revealed?answerBlock(q,ans.choice,false):''}<div class="fixedactions">${s.revealed?`<button class="btn secondary" onclick="go('home')">Pause</button><button class="btn" onclick="next()">${s.index===s.ids.length-1?'Finish session':'Next question'} →</button>`:`<button class="btn ghost sm" onclick="skip()">Skip</button><button class="btn" ${s.selected===null?'disabled':''} onclick="answer()">${s.exam?'Submit answer →':'Check answer'}</button>`}</div><div class="small muted" style="text-align:center;margin-top:20px"><button class="link" onclick="go('home')">${s.exam?'Leave screen (timer continues)':'Pause and save'}</button> · <button class="link" onclick="abandon()">End session</button></div></div>`}
function finish(){let s=state.finished;if(!s)return `<div class="empty"><h3>No completed session</h3><button class="btn" onclick="go('practice')">Start practice</button></div>`;return `<section class="hero"><div class="eyebrow">Session complete</div><h1 class="finishscore">${s.total?Math.round(s.score/s.total*100):0}%</h1><p>${s.score} of ${s.total} correct · ${Object.keys(s.answers).length} answered · ${Math.max(1,Math.round((s.completed-s.started)/60000))} minute(s)</p><div class="btnrow"><button class="btn" onclick="go('results')">Review answers</button><button class="btn secondary" onclick="go('practice')">New session</button></div></section><div class="panel"><h3>What this score means</h3><p>Scores reflect these questions, not a certification or calibrated professional proficiency. Revisit missed items and verify implementation judgments against the linked primary sources.</p></div>`}
function results(){let s=state.finished;if(!s)return '<div class="empty">No completed exam to review.</div>';return `<h1>Answer review</h1><p class="muted">${s.score} of ${s.total} correct. All options retain their original explanations, even after shuffling.</p>${s.ids.map((id,i)=>{let q=BANK.find(q=>q.id===id);let a=s.answers[id];return `<details ${!a?.correct?'open':''}><summary>${i+1}. ${!a?'—':a.correct?'✓':'✕'} ${esc(q.stem)}</summary>${answerBlock(q,a?.choice??-1,true)}</details>`}).join('')}<div style="margin:25px 0"><button class="btn" onclick="go('practice')">New session</button></div>`}
function review(){let missed=BANK.filter(q=>tried(q)&&!last(q).correct),dueQs=BANK.filter(due),marked=BANK.filter(q=>state.bookmarks.includes(q.id));let list=[['Previously missed',missed,'missed'],['Due for review',dueQs,'due'],['Bookmarked',marked,'bookmarks']];return `<h1>Review queue</h1><p class="muted">Target what you missed and return to concepts after a delay.</p><div class="grid"><div class="metric"><strong>${missed.length}</strong><span>Missed last time</span></div><div class="metric"><strong>${dueQs.length}</strong><span>Due now</span></div><div class="metric"><strong>${marked.length}</strong><span>Bookmarked</span></div></div>${list.map(([name,qs,mode])=>`<div class="panel"><h3>${name} <span class="pill">${qs.length}</span></h3>${qs.length?`<p class="small">${esc(qs.slice(0,3).map(x=>x.domain).join(' · '))}${qs.length>3?' …':''}</p><button class="btn sm secondary" onclick="reviewMode('${mode}')">Practice ${Math.min(20,qs.length)} →</button>`:'<p class="small">Nothing in this queue yet.</p>'}</div>`).join('')}<div class="panel"><h3>Data and backup</h3><p class="small">Progress is saved in this browser. Export a backup before clearing browser data or moving phones.</p><div class="btnrow"><button class="btn secondary sm" onclick="exportData()">Export progress JSON</button><button class="btn ghost sm" onclick="document.getElementById('import').click()">Import progress JSON</button></div><input id="import" type="file" accept="application/json,.json" hidden onchange="importData(this)"></div>`}
function reviewMode(m){cfg={...cfg,mode:m,count:20,domains:[],levels:['E','A','D','V'],timed:false};start(false)}
function progress(){let s=allStats();let byLevel=['E','A','D','V'].map(l=>{let v=levelStat(l);return `<div class="statrow"><div class="l">${LEVEL[l]} · ${v.seen}/56 seen</div><div class="n">${v.rate===null?'—':v.rate+'%'}</div></div>`}).join('');let ds=[...D].sort((a,b)=>{let x=domainStat(a),y=domainStat(b);return x.seen-y.seen||((x.rate??0)-(y.rate??0))});return `<div class="eyebrow">Progress dashboard</div><h1>Competency coverage</h1><div class="grid"><div class="metric"><strong>${s.seen}/224</strong><span>Unique seen</span></div><div class="metric"><strong>${s.attempts}</strong><span>Total answers</span></div><div class="metric"><strong>${userDays()}</strong><span>Day streak</span></div></div><div class="sectionhead"><h2>Performance by level</h2><span class="small muted">Latest attempt per question</span></div><div class="statgrid">${byLevel}</div><div class="sectionhead"><h2>Domains</h2><span class="small muted">Sorted by coverage</span></div><div class="panel">${ds.map((d,i)=>{let x=domainStat(d),pct=Math.round(x.seen/x.total*100);return `<div class="rank"><div style="flex:1;min-width:0"><div class="name">${esc(d)}</div><div class="bar"><i style="width:${pct}%"></i></div><small>${x.seen}/${x.total} seen · ${x.rate===null?'Not assessed':x.rate+'% latest accuracy'}</small></div><button class="btn ghost sm" onclick="oneDomain(${D.indexOf(d)})">Study</button></div>`}).join('')}</div><div class="panel"><h3>Data portability</h3><p class="small">The app makes no network requests for question content or progress. Source links open externally only when tapped.</p><div class="btnrow"><button class="btn secondary sm" onclick="exportData()">Export backup</button><button class="btn ghost sm" onclick="document.getElementById('import2').click()">Import backup</button><button class="btn danger sm" onclick="resetData()">Reset progress</button></div><input id="import2" type="file" accept="application/json,.json" hidden onchange="importData(this)"></div>`}
function oneDomain(i){cfg={...cfg,domains:[D[i]],levels:['E','A','D','V'],count:8,mode:'all',timed:false};start(false)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-security-prep-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup exported')}
function importData(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==1||typeof x.history!=='object'||!Array.isArray(x.bookmarks))throw Error('Unsupported format');if(!confirm('Replace progress on this device with the imported backup?'))return;const validIds=new Set(BANK.map(q=>q.id));const history={};for(let [k,v] of Object.entries(x.history)){if(!validIds.has(k)||!Array.isArray(v.attempts))continue;history[k]={attempts:v.attempts.filter(a=>typeof a.correct==='boolean'&&Number.isFinite(a.t)).slice(-50),ease:Number(v.ease)||2.5,due:Number(v.due)||0,streak:Number(v.streak)||0}}state={...fresh(),history,bookmarks:x.bookmarks.filter(id=>validIds.has(id)),session:null,recent:Array.isArray(x.recent)?x.recent.slice(-500):[]};save();render();toast('Progress imported')}catch(e){toast('Invalid or unsupported backup')}};r.readAsText(f)}
function resetData(){if(!confirm('Permanently clear all progress on this device? Export a backup first.'))return;state=fresh();save();go('home');toast('Progress reset')}
render();
setInterval(()=>{const s=state.session;if(!s?.exam||!s.deadline)return;const left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let el=document.getElementById('clock');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left===0){toast('Exam time ended');finishSession()}},1000);
</script></body></html>
