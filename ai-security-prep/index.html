source":"mcp"},{"id":"ce2a839a3af2","domain":"Agents, tools and MCP","level":"A","stem":"A planning agent loops through failed calls until rate limits trip. What should you inspect?","choices":[{"text":"Retry limits, idempotency and failure responses","why":"Autonomy requires bounded operation under failure"},{"text":"Only the model's pretraining date","why":"It does not explain loop controls"},{"text":"Only the LLM's refusal text after each failed tool call","why":"Refusal wording does not impose execution-time retry budgets"},{"text":"Whether the agent used exactly four tools","why":"Count alone does not reveal retry behavior"}],"takeaway":"Instrument plan steps and constrain retries and side effects.","source":"mcp"},{"id":"74ab45f09b54","domain":"Agents, tools and MCP","level":"A","stem":"A low-trust tool returns fabricated 'approval granted' metadata, and an agent executes a purchase. What boundary failed?","choices":[{"text":"The agent accepted forged approval from tool output","why":"Tool responses can be attacker-controlled evidence"},{"text":"The payment method was not tokenized","why":"Payment protection is a separate concern"},{"text":"The model lacked enough context tokens","why":"More context doesn't validate approval"},{"text":"The forged metadata came from a nominally trusted integration","why":"A trusted connector can still carry lower-trust or compromised content"}],"takeaway":"Approval must be a verifiable state transition, not a string in context.","source":"mcp"},{"id":"0de93459b7db","domain":"Agents, tools and MCP","level":"D","stem":"A research agent has web search and an internal ticketing tool. Which architecture most reduces indirect injection risk?","choices":[{"text":"Check access at the ticket tool, not in web results","why":"Public web content should not direct internal writes"},{"text":"Combine both tools under the broadest service token","why":"That maximizes the attack path"},{"text":"Allow ticket changes whenever search finds a convincing answer","why":"Search content is untrusted"},{"text":"Encode all tools into the same developer message","why":"Instruction placement does not enforce service permissions"}],"takeaway":"Restrict privileges and validate action preconditions outside the model.","source":"mcp"},{"id":"3d37124de1b6","domain":"Agents, tools and MCP","level":"D","stem":"A tool server can execute shell commands for an agent. What is the safest default?","choices":[{"text":"Disable unnecessary shell access; otherwise isolate capabilities and egress","why":"General-purpose execution expands blast radius dramatically"},{"text":"Give shell root access but add a warning in the tool description","why":"Warnings do not constrain execution"},{"text":"Allow unrestricted commands but inspect generated shell text before execution","why":"String inspections are brittle and cannot replace sandbox/capability restrictions"},{"text":"Rely on container names to convey trust boundaries","why":"Names do not isolate resources"}],"takeaway":"Design a narrow capability interface before exposing broad executors.","source":"mcp"},{"id":"2f2c14f7bcec","domain":"Agents, tools and MCP","level":"V","stem":"An organization wants to add 30 agent tools next week. What is the right review unit?","choices":[{"text":"Identity, scope and effects of each tool","why":"Tool count is less important than effective capabilities"},{"text":"Only total token usage by the agent","why":"Costs don't capture authority"},{"text":"Only the vendor's tool directory rating","why":"A rating cannot prove deployment-specific security"},{"text":"Only whether tools support JSON","why":"Typed arguments help but don't establish safety"}],"takeaway":"Gate tools on concrete reachability, policy and evidence.","source":"mcp"},{"id":"8be8b68da8a7","domain":"Agents, tools and MCP","level":"V","stem":"A supplier promises 'human in the loop' for every risky agent action. Which test exposes weak implementation?","choices":[{"text":"Try a risky action, then verify separate approval bound to each argument","why":"A generic approval banner can be replayed or misapplied"},{"text":"Demonstrate that an approval button is presented before all tool calls tagged high risk","why":"A visible UI is insufficient if the approved call can change its target, amount or arguments afterward."},{"text":"Verify approval is recorded with user and timestamp in a centrally retained audit log","why":"Auditability matters, but logged approval is not proof that execution is constrained to the approved action."},{"text":"Require MFA when a user initiates the session and allow its approval to authorize later actions","why":"Session authentication does not establish per-action consent for consequential model-selected parameters."}],"takeaway":"Approvals need integrity, scope, timing and non-replay guarantees.","source":"mcp"},{"id":"28b4712a9e62","domain":"Guardrails and policy enforcement","level":"E","stem":"A system prompt forbids PII output but the assistant can query unrestricted HR data. What is missing?","choices":[{"text":"Enforceable data access and output policy outside the model","why":"Prompts do not compensate for overbroad data access"},{"text":"A second system prompt that independently scores the first model's output","why":"A second model is a probabilistic check, not an enforceable data or action boundary."},{"text":"Post-generation DLP scanning of assistant responses before display","why":"Output DLP can mitigate leaks but cannot stop unauthorized retrieval or tool processing."},{"text":"A stricter response formatter that redacts names in the final answer","why":"Name redaction is narrower than complete identity-aware data authorization and policy enforcement."}],"takeaway":"Prevention should precede post-generation detection where feasible.","source":"owasp"},{"id":"bb8f17eae066","domain":"Guardrails and policy enforcement","level":"E","stem":"An output filter detects credit-card patterns. Why is it insufficient as a general confidentiality control?","choices":[{"text":"Pattern matching misses sensitive context and derived disclosures","why":"Pattern DLP is useful but incomplete"},{"text":"Every PII detector has perfect recall with enough compute","why":"False negatives are unavoidable in practice"},{"text":"All exfiltration uses plain text output","why":"Tools, files and encoded forms can leak too"},{"text":"Encryption at rest eliminates output risk","why":"Authorized outputs can still disclose secrets"}],"takeaway":"Combine data minimization, authorization, output checks and egress controls.","source":"owasp"},{"id":"d49847cbe020","domain":"Guardrails and policy enforcement","level":"A","stem":"A policy engine denies a file export but the model reports 'Export succeeded.' What should operators trust?","choices":[{"text":"The tool and policy enforcement logs rather than generated narrative","why":"Model output can misstate action outcome"},{"text":"The model's final answer because it is user-facing","why":"Narrative is not authoritative execution evidence"},{"text":"The model's chain-of-thought estimate of whether export happened","why":"Model reasoning is not the source-of-truth for policy-enforced actions"},{"text":"The policy engine only if the model agrees with it","why":"Enforcement decisions are independent of model agreement"}],"takeaway":"Keep authoritative tool results separate from explanation text.","source":"owasp"},{"id":"cbcc61d0f5b8","domain":"Guardrails and policy enforcement","level":"A","stem":"A content classifier blocks innocuous clinical notes disproportionately. What is the relevant evaluation issue?","choices":[{"text":"Measure the harms of false positives","why":"Overblocking can create patient-care and fairness risks"},{"text":"A higher recall is sufficient evidence of acceptability","why":"Recall says nothing about overblocking cost"},{"text":"Any safety filter with false positives must be disabled","why":"Controls can be calibrated and layered"},{"text":"Adding more deny keywords guarantees fairness","why":"Keyword expansions can increase disparate false positives"}],"takeaway":"Evaluate both bypass and overblocking in the real workflow.","source":"owasp"},{"id":"081c2e915fc9","domain":"Guardrails and policy enforcement","level":"D","stem":"A financial agent must not send client data to public endpoints. Where is the highest-assurance constraint?","choices":[{"text":"Enforce egress destinations and tool scopes","why":"It blocks the action regardless of model wording"},{"text":"A hidden paragraph asking the model to be careful","why":"Prompt obedience is not a guaranteed boundary"},{"text":"Rely on the URL looking reputable","why":"Appearance is not authorization"},{"text":"Add a post-hoc summary of transmitted data","why":"A report cannot undo disclosure"}],"takeaway":"Put unskippable checks on the action path.","source":"owasp"},{"id":"a7fbe516e5a1","domain":"Guardrails and policy enforcement","level":"D","stem":"A school deploys a student advisor using internal guidance plus policy rules. Which design best handles exceptions?","choices":[{"text":"Authoritative policy rules with managed human exceptions","why":"Exceptions should be traceable and reviewed"},{"text":"Encode all exceptions in few-shot examples only","why":"Examples are hard to audit or maintain"},{"text":"Let the model approve any exception when empathetic","why":"Empathy is not authority"},{"text":"Keep policies in a shared drive and trust the model to choose the newest","why":"Recency alone may not determine policy applicability"}],"takeaway":"Treat the model as an interface to enforceable policy, not the policy authority.","source":"owasp"},{"id":"4b418e2add7f","domain":"Guardrails and policy enforcement","level":"V","stem":"An AI safety dashboard shows '98% requests filtered.' What is the most important missing denominator?","choices":[{"text":"The number of harmful/unauthorized attempts and their actual escape rate","why":"Filtering volume alone does not measure effectiveness"},{"text":"The proportion of blocked requests without ground-truth attack labels","why":"A block rate alone cannot estimate harmful attempts that escaped"},{"text":"The number of employees who saw the dashboard","why":"Audience does not establish filter performance"},{"text":"The total number of prompts scanned without classifying their risk","why":"Volume does not reveal missed dangerous requests"}],"takeaway":"Report false negatives, false positives, coverage and consequence.","source":"owasp"},{"id":"716896e1d11c","domain":"Guardrails and policy enforcement","level":"V","stem":"A vendor sells a 'universal prompt injection firewall.' What proof should you demand?","choices":[{"text":"Adaptive tests against your tool permissions, sources, encodings and measurable residual paths","why":"A detector alone may not block privileged operations"},{"text":"Demand a benchmark recall figure and evidence the vendor tested on leading model families","why":"A broad benchmark still may miss environment-specific tool chains, encodings and adaptation."},{"text":"Evaluate its prompt-detection latency and the number of known attack signatures","why":"Speed and signature coverage do not prove prevention of unauthorized downstream effects."},{"text":"Test it only against a curated set of historical jailbreak prompts from the vendor","why":"Vendor-curated cases do not assess adaptive attackers or the customer's relevant entry paths."}],"takeaway":"Treat detection as one layer and test realistic exploit reachability.","source":"owasp"},{"id":"30ef744477b3","domain":"AI infrastructure and runtime","level":"E","stem":"An inference endpoint uses private networking. Which exposure can still exist?","choices":[{"text":"Application identities may have excessive data and tool permissions","why":"Network placement does not enforce app-level least privilege"},{"text":"Transport-layer exposure if private networking is not configured for every dependent service","why":"That is one possible risk, but the premise already establishes private endpoint networking and asks what remains."},{"text":"Improper data residency if the app frontend is deployed in another geographic region","why":"Residency may matter, but frontend location alone cannot establish exposure; overprivilege persists despite networking."},{"text":"Excessive output length that causes model truncation under heavy load","why":"Availability is a concern, but it does not address access to sensitive datasets and tools."}],"takeaway":"Evaluate identity, data, egress and platform boundaries separately.","source":"nist"},{"id":"10b8099d1737","domain":"AI infrastructure and runtime","level":"E","stem":"Why are GPU and accelerator security concerns not identical to CPU VM isolation?","choices":[{"text":"GPU sharing creates distinct isolation risks","why":"Hardware architecture changes isolation assumptions"},{"text":"GPUs cannot be virtualized or shared","why":"Modern platforms support different forms of sharing"},{"text":"Only physical theft can expose GPU memory","why":"Software isolation failures may expose data"},{"text":"CPU threat modeling is therefore unnecessary","why":"CPU hosts remain part of the trust base"}],"takeaway":"Threat model the complete compute stack and tenancy.","source":"nist"},{"id":"13bb6aa03fbb","domain":"AI infrastructure and runtime","level":"A","stem":"A hosted embedding endpoint suddenly incurs tenfold cost from a single integration. What control should be examined?","choices":[{"text":"Per-principal quotas, attribution, throttling and anomaly detection","why":"Economic denial of service can be a security issue"},{"text":"Only the model's number of layers","why":"Architecture may affect unit cost but not uncontrolled caller behavior"},{"text":"Whether high token prices sufficiently discourage abusive use","why":"Pricing may discourage some users but cannot bound a compromised integration"},{"text":"Whether responses are written in JSON","why":"Output format isn't the primary spending control"}],"takeaway":"Bound resource consumption by identity and workload.","source":"nist"},{"id":"556b77433fbd","domain":"AI infrastructure and runtime","level":"A","stem":"A private inference cluster serves two tenants; one can observe correlated latency spikes. What should be investigated?","choices":[{"text":"Shared-resource side channels, scheduling and isolation claims","why":"Performance patterns may expose workload information"},{"text":"Whether the two tenant endpoints share an authentication gateway","why":"Identity separation does not necessarily prevent compute side channels"},{"text":"Whether inference requests use different system prompts","why":"Prompts do not directly eliminate shared runtime timing leakage"},{"text":"Whether encryption protects stored prompts at rest","why":"At-rest encryption does not prevent timing side channels on shared compute"}],"takeaway":"Test observable cross-tenant signals and provider isolation assurances.","source":"nist"},{"id":"8bc47293d708","domain":"AI infrastructure and runtime","level":"D","stem":"A self-hosted model can invoke internal APIs and download public packages. Which default container controls are strongest?","choices":[{"text":"Non-root execution, restrictive egress and least-privileged identity","why":"Combines workload hardening with constrained reachability"},{"text":"Privileged containers to simplify GPU mounting","why":"Privileged mode enlarges host attack surface"},{"text":"Unfiltered outbound internet for package convenience","why":"Enables exfiltration and unreviewed dependencies"},{"text":"Share the Kubernetes node service-account token with the model","why":"Introduces broad cloud authority"}],"takeaway":"Reduce default capabilities and explicitly permit dependencies.","source":"nist"},{"id":"ef15467664b9","domain":"AI infrastructure and runtime","level":"D","stem":"An enterprise hosts inference across several regions with strict residency commitments. What must the design pin down?","choices":[{"text":"Regions for processing, logs and failover","why":"Primary inference region alone does not define residency"},{"text":"Only the app's DNS region","why":"DNS placement may differ from processing"},{"text":"Only the user's device location","why":"Backend and logging destinations matter too"},{"text":"Only the region assigned to the primary model endpoint","why":"Logging, failover and support processing can have other destinations"}],"takeaway":"Document every plaintext or metadata path in normal and failover operation.","source":"nist"},{"id":"9265a4fbc120","domain":"AI infrastructure and runtime","level":"V","stem":"An architecture review labels a model 'air-gapped' but its monitoring agent posts telemetry to SaaS. What is the finding?","choices":[{"text":"Outbound telemetry contradicts the stated air-gap boundary","why":"Air-gap claims require complete data-flow evidence"},{"text":"Monitoring is always forbidden in regulated systems","why":"Offline monitoring can be designed"},{"text":"Telemetry never contains sensitive data","why":"Prompts and identifiers may appear in logs"},{"text":"A firewall diagram alone proves no exfiltration","why":"Actual routes and configuration must be checked"}],"takeaway":"Validate effective egress, not product labels.","source":"nist"},{"id":"e777ae7f8dce","domain":"AI infrastructure and runtime","level":"V","stem":"A client needs an inference SLA. What security-related availability criteria should be included?","choices":[{"text":"Rate limits, dependency failure behavior, graceful degradation and abuse containment","why":"An SLA without overload modes misses important risks"},{"text":"Specify peak throughput and p95 response latency under nominal load with contractual service credits","why":"Performance targets alone omit abuse behavior and safe failure at dependent security controls."},{"text":"Require a redundant model provider and automatic failover to maintain user-facing availability","why":"Failover can broaden data processing or bypass guardrails unless explicitly secured and tested."},{"text":"Define response-time objectives for high-priority users and rate-limit everyone else","why":"Tiered service can help performance but is not an abuse-containment or dependency-failure plan."}],"takeaway":"Define behavior when critical dependencies and budgets fail.","source":"nist"},{"id":"756f6f8d3ecc","domain":"Model and data supply chain","level":"E","stem":"A signed model checkpoint has not been reviewed for unsafe deserialization. What does the signature establish?","choices":[{"text":"The artifact's integrity/provenance relative to a trusted signer, not that loading it is safe","why":"Authentic artifacts can still contain dangerous payloads"},{"text":"The checkpoint conforms to an approved training recipe and benchmark suite","why":"A signature attests the signed artifact, not whether its training process was secure or benchmarks valid."},{"text":"The checkpoint is free from code-execution risk if it came from an approved publisher","why":"Trust in a signer does not make an unsafe deserialization format harmless."},{"text":"The checkpoint is compatible with the organization's installed inference runtime","why":"Artifact compatibility and provenance are independent properties; a valid signature does not prove compatibility."}],"takeaway":"Verify both origin and safe consumption of model artifacts.","source":"nist"},{"id":"a36c1adbc9ad","domain":"Model and data supply chain","level":"E","stem":"Why is an embedding model update a security-relevant dependency change?","choices":[{"text":"Retrieval and leakage behavior can change","why":"Behavior may change even if the app API stays stable"},{"text":"Embeddings only affect cosmetic layout","why":"They influence which data reaches the model"},{"text":"Embedding models cannot be modified after release","why":"Providers can update them"},{"text":"Only generation models require testing","why":"Retrieval components are security-critical too"}],"takeaway":"Include embedding models in the AI software bill of materials.","source":"nist"},{"id":"0e9aed856d0a","domain":"Model and data supply chain","level":"A","stem":"An open-source model loads a third-party Python pickled object at startup. What is the first technical concern?","choices":[{"text":"Loading an untrusted pickle file can run code","why":"Untrusted pickle loading is an execution vector"},{"text":"The object will necessarily have lower model accuracy","why":"Security is independent of performance"},{"text":"The model registry scanner reported no known CVEs","why":"A clean vulnerability scan does not prevent deserialization code execution"},{"text":"The model is always licensed permissively if open source","why":"Licenses vary"}],"takeaway":"Prefer safer formats and sandbox any unavoidable risky loaders.","source":"nist"},{"id":"90e9fa272c8b","domain":"Model and data supply chain","level":"A","stem":"A vendor offers a model with a public checksum but no reproducible provenance. What's still unproven?","choices":[{"text":"Who built the model and how it was trained","why":"Checksums detect changes from a known value but not trustworthiness"},{"text":"Whether the file is the same bytes as the posted hash","why":"That is exactly what a checksum can check"},{"text":"Whether the model file was transferred over HTTPS","why":"Secure transport does not establish the model creator's provenance"},{"text":"Whether the model can be used offline","why":"Provenance does not imply hosting mode"}],"takeaway":"A hash needs a trustworthy chain tying artifacts to claims.","source":"nist"},{"id":"d34eb5043a36","domain":"Model and data supply chain","level":"D","stem":"A production pipeline imports models from a community registry. What is the strongest promotion workflow?","choices":[{"text":"Provenance checks, safe loading and signed release","why":"Model release needs multi-stage assurance"},{"text":"Pull the newest model automatically into production","why":"Unreviewed changes create supply-chain risk"},{"text":"Assume trending downloads establish quality and safety","why":"Popularity is not provenance"},{"text":"Require only the developer's email approval","why":"One attestation does not verify artifact properties"}],"takeaway":"Make model promotion analogous to controlled software release, with AI-specific tests.","source":"nist"},{"id":"f240e081473f","domain":"Model and data supply chain","level":"D","stem":"A RAG app ingests third-party datasets that may be updated silently. Which design best supports incident rollback?","choices":[{"text":"Keep hashes so you can rebuild the index","why":"Versioned data enables targeted remediation"},{"text":"Retain only the newest embedding index","why":"This destroys prior-state reconstruction"},{"text":"Trust file timestamps without content hashes","why":"Timestamps can change without content integrity"},{"text":"Archive only the user interface bundle","why":"The data influences model behavior and risk"}],"takeaway":"Track data artifacts with the same rigor as code and models.","source":"nist"},{"id":"1e82b6128f14","domain":"Model and data supply chain","level":"V","stem":"A client asks if a foundation-model provider is 'secure.' What supplier evidence matters most?","choices":[{"text":"Evidence that the vendor limits where data goes","why":"Security depends on processing and service obligations"},{"text":"A generic 'responsible AI' webpage by itself","why":"Commitments require operational and contractual evidence"},{"text":"An SOC report without checking scope and exceptions","why":"Certifications can omit the actual AI service"},{"text":"One penetration-test badge from a different product","why":"Assurance must cover the used deployment"}],"takeaway":"Verify the exact service, region and feature in scope.","source":"nist"},{"id":"1190e91f8804","domain":"Model and data supply chain","level":"V","stem":"A fine-tuned checkpoint is copied into three environments with different labels. How do you control drift?","choices":[{"text":"Use immutable artifact IDs, signed manifests and environment deployment inventory","why":"Names alone do not establish which weights are running"},{"text":"Use strict naming conventions and require all deployment teams to sign a release checklist","why":"Procedural consistency lacks cryptographic identity of the actual deployed checkpoint."},{"text":"Record one model registry version but permit environment-specific adapter patches","why":"Untracked adapter changes can materially alter behavior despite a shared base version."},{"text":"Export an artifact checksum for each environment at release time without a reconciled inventory","why":"Checksums are useful only if mapped to provenance and audited across deployments."}],"takeaway":"Tie deployed model behavior to immutable versions and evidence.","source":"nist"},{"id":"093b95ca7e10","domain":"MLOps and change control","level":"E","stem":"Why is a prompt-template change potentially a material production release?","choices":[{"text":"It can change model behavior, tool choices and security boundaries without changing model weights","why":"Inference configuration is part of the effective system"},{"text":"Prompt changes are important only when a new model version is also released","why":"A prompt can materially alter model behavior even with a fixed model binary."},{"text":"Prompt versioning is unnecessary if the model temperature and retrieval settings are pinned","why":"Pinned decoding and retrieval do not prevent behavioral changes caused by prompt edits."},{"text":"Prompt updates affect wording but cannot affect which downstream tools are invoked","why":"Prompt structure and instructions can influence tool selection, content and safety decisions."}],"takeaway":"Version prompts, models, tools, retrieval and policies together.","source":"nist"},{"id":"b88a7403e545","domain":"MLOps and change control","level":"E","stem":"An inference system passes a model-quality test but fails a schema compatibility test. Which failure is being exposed?","choices":[{"text":"Application schema compatibility failure","why":"Downstream consumers depend on parsable structure"},{"text":"A model extraction attack has been proven","why":"No attacker behavior is shown"},{"text":"Training leakage is certain","why":"Schema breakage does not imply leakage"},{"text":"A clean training-data checksum","why":"Data integrity does not prove application schema compatibility"}],"takeaway":"Include parser and tool-interface tests in AI release gates.","source":"nist"},{"id":"c4303d6b61de","domain":"MLOps and change control","level":"A","stem":"A staging assistant passes tests, while production fails because a connector has broader permissions. What should be compared?","choices":[{"text":"Compare production and test permissions","why":"Security behavior depends on deployment configuration"},{"text":"Only the prompt template revision number","why":"Prompt differences may matter but not the backend permission discrepancy"},{"text":"Only the model API version in staging and production","why":"Version parity does not prove permission and identity parity"},{"text":"The foundation model's published benchmark","why":"A vendor score can't diagnose environment drift"}],"takeaway":"Test environment parity at trust boundaries, not only prompts.","source":"nist"},{"id":"e4307a371f52","domain":"MLOps and change control","level":"A","stem":"An upgrade improves benchmark accuracy but doubles unsafe tool calls. How should release quality be judged?","choices":[{"text":"Gate on safety, utility and valid actions","why":"Quality is not a single accuracy score"},{"text":"Ship because aggregate accuracy improved","why":"Improvement in one objective can hide unsafe behavior"},{"text":"Rollback only if user satisfaction falls","why":"Security issues may precede user complaints"},{"text":"Change the dashboard to weight accuracy higher","why":"Metrics must reflect risk rather than desired approval"}],"takeaway":"Monitor safety regressions as first-class release blockers.","source":"nist"},{"id":"f01e039b3b61","domain":"MLOps and change control","level":"D","stem":"A team operates ten AI applications sharing models and retrieval services. Which artifact enables controlled rollback?","choices":[{"text":"Pin all app versions in one manifest","why":"Reproducibility requires the complete effective configuration"},{"text":"A spreadsheet listing only model names","why":"Other dependencies influence behavior"},{"text":"A weekly screenshot of the chatbot","why":"Screenshots cannot reproduce a deployment"},{"text":"A prompt stored in one engineer's notes","why":"This loses provenance and dependency state"}],"takeaway":"Treat an AI system release as a versioned dependency graph.","source":"nist"},{"id":"119fea08631f","domain":"MLOps and change control","level":"D","stem":"An evaluation pipeline repeatedly uses the same public benchmark for prompt tuning. What risk emerges?","choices":[{"text":"Benchmark contamination from repeated optimization against test data","why":"Performance on reused cases may not generalize"},{"text":"A cryptographic weakness in the benchmark checksum","why":"Not described"},{"text":"A larger public benchmark sample would eliminate overfitting","why":"Repeated tuning can still overfit the held-out evaluation design"},{"text":"All generated code becomes unlicensed","why":"No licensing fact follows"}],"takeaway":"Hold back representative test cases and use external/adaptive evaluations.","source":"nist"},{"id":"8cb0424913ad","domain":"MLOps and change control","level":"V","stem":"A client asks for an AI release checklist. Which item is most critical to make it operational?","choices":[{"text":"Owned, testable release gates and exceptions","why":"Control statements without evidence or authority are ceremonial"},{"text":"A single checkbox labeled 'responsible AI'","why":"Not specific or testable"},{"text":"Only links to policy PDFs","why":"Reading policies is not an execution gate"},{"text":"Only an executive sign-off with no test results","why":"Approval cannot replace validation"}],"takeaway":"Tie gates to artifacts, tests, named decision makers and rollback.","source":"nist"},{"id":"0694838dcbef","domain":"MLOps and change control","level":"V","stem":"A model drift alert fires; the business wants immediate retraining. What's the strongest next step?","choices":[{"text":"Find what drifted, assess the harm, then choose the fix","why":"Retraining may not solve root cause"},{"text":"Retrain immediately on the newest data and compare aggregate validation accuracy to the prior version","why":"An immediate retrain can embed bad labels or conceal upstream pipeline faults."},{"text":"Raise the drift threshold and keep production unchanged until the next scheduled review","why":"Threshold adjustment without impact analysis may hide a high-consequence deterioration."},{"text":"Roll back to last quarter's model because the prior version predates the alert","why":"A previous model can perform worse on current inputs, so diagnose before selecting remediation."}],"takeaway":"Connect monitoring to diagnosis and controlled remediation.","source":"nist"},{"id":"bb36ab6622fb","domain":"Privacy and data protection","level":"E","stem":"A vendor promises not to use prompts for training. Which privacy question remains open?","choices":[{"text":"Where data is kept, who sees it, and for how long","why":"No-training is narrower than no-processing"},{"text":"Whether the provider guarantees response accuracy for regulated queries","why":"Accuracy is important for use-case assurance but does not answer the remaining data-processing and retention question."},{"text":"Whether the model's context window can accept complete source documents","why":"Capacity affects functionality, not which parties can view or retain sensitive prompts."},{"text":"Whether prompts are encrypted when stored in the client's own browser","why":"Client-side encryption can matter, but it does not resolve provider-side processing, logging or subcontractors."}],"takeaway":"Evaluate the full data lifecycle and contractual scope.","source":"nist"},{"id":"13f9061ee799","domain":"Privacy and data protection","level":"E","stem":"Why can removing names and emails from a dataset be insufficient de-identification?","choices":[{"text":"Linkage attacks using quasi-identifiers and external records","why":"Identity may be inferred from combinations"},{"text":"Anonymization is impossible under any circumstances","why":"Risk depends on data and method"},{"text":"Encryption at rest automatically makes data anonymous","why":"Encrypted personal data may remain personal data"},{"text":"Every dataset without names is public","why":"Sensitivity and rights survive name removal"}],"takeaway":"Assess re-identification risk and context, not only obvious identifiers.","source":"nist"},{"id":"71b050acbfd9","domain":"Privacy and data protection","level":"A","stem":"An employee pastes customer records into a consumer chatbot, which says it doesn't train on input. What should you examine?","choices":[{"text":"Can the vendor use, store, or share the records?","why":"A no-training claim is only one data-use dimension"},{"text":"Whether the employee pasted data from a managed device","why":"Device controls matter, but they do not establish the AI service's data-use terms"},{"text":"Whether the model claims to exclude inputs from training","why":"Training exclusions are only part of the broader processing assessment"},{"text":"Assume all AI SaaS is prohibited regardless of terms","why":"Risk is feature- and use-case-specific"}],"takeaway":"Distinguish processing, storage, training and onward disclosure.","source":"nist"},{"id":"cab495a146b2","domain":"Privacy and data protection","level":"A","stem":"A generated summary accurately reveals a private diagnosis from permitted source text to an unauthorized manager. What failed?","choices":[{"text":"Recipient authorization and permitted-purpose boundaries","why":"A true answer can still be an unlawful or unauthorized disclosure"},{"text":"Hallucination screening","why":"The disclosed information was true"},{"text":"The summarizer's source attribution and citation quality","why":"Accurate citations do not make the disclosure authorized"},{"text":"The summarizer's ability to cite sources","why":"Citations do not grant rights"}],"takeaway":"Separate correctness from permitted access and use.","source":"nist"},{"id":"4064b407cb54","domain":"Privacy and data protection","level":"D","stem":"A clinical RAG assistant needs records for treatment but should not retain raw prompts indefinitely. What architecture is strongest?","choices":[{"text":"Minimal retrieval, limited retention and audited access","why":"Use only what is needed and preserve necessary operational evidence"},{"text":"Copy every record into every model prompt to improve recall","why":"Broad context increases exposure"},{"text":"Store no security logs under any condition","why":"Auditability and privacy can be balanced"},{"text":"Use an opaque prompt instead of data-access controls","why":"Prompts do not establish permitted disclosure"}],"takeaway":"Design access, retention and observability together.","source":"nist"},{"id":"d92c28fb90b3","domain":"Privacy and data protection","level":"D","stem":"A client wants to index employee performance reviews for search. Which control most directly protects sensitive data?","choices":[{"text":"Authorize retrieval before building model context","why":"Authorized subjects must be determined before disclosure"},{"text":"Hide the search box until onboarding is complete","why":"UI obscurity is weak"},{"text":"Rely on output filtering to remove names after retrieval","why":"Sensitive content may already reach the model"},{"text":"Use a more accurate embedding model","why":"Relevance is independent of authorization"}],"takeaway":"Keep sensitive data out of model context unless the requester is entitled.","source":"nist"},{"id":"016780f1c59a","domain":"Privacy and data protection","level":"V","stem":"A vendor offers an enterprise BAA but its optional web-search feature uses different terms. What is the consulting action?","choices":[{"text":"Map each feature's data flow to actual contractual coverage","why":"Enterprise terms may not extend to every add-on"},{"text":"Assume all features inherit the same agreement","why":"Contract scope matters"},{"text":"Disable all web browsing at the operating-system level automatically","why":"Risk treatment should be scoped and supported"},{"text":"Ask the model to self-declare HIPAA compliance","why":"Model claims do not establish legal agreements"}],"takeaway":"Contract review must follow actual configured features.","source":"nist"},{"id":"06e80835d356","domain":"Privacy and data protection","level":"V","stem":"A client asks if differential privacy guarantees that a deployed model cannot expose any person's data. What's the correct response?","choices":[{"text":"It limits training leakage under defined conditions, not every other exposure","why":"DP does not replace access, runtime and application controls"},{"text":"Apply differential privacy to the training process and treat all later prompts as nonsensitive","why":"DP may constrain record-level training leakage but not leakage from prompts, retrieval or tools."},{"text":"Use a small privacy budget and assume data-subject inference is impossible","why":"Privacy accounting is assumption-dependent and does not eliminate all membership or inference risk."},{"text":"Require provider assurances of DP but forgo testing data ingestion and inference access","why":"DP claims do not cover the whole information life cycle or provide evidence of proper implementation."}],"takeaway":"Explain the guarantee, its parameters and its limits.","source":"nist"},{"id":"b66fdf05022e","domain":"Testing and red teaming","level":"E","stem":"A model refuses harmful prompts in isolation but an integrated agent still executes unsafe actions. What distinction explains this?","choices":[{"text":"A model can refuse text and still be unsafe with tools","why":"Tools and permissions can create consequences despite refusals"},{"text":"The agent uses a different base model than the tested standalone chatbot","why":"Model differences may contribute, but the core gap is the untested action-taking system boundary."},{"text":"The benchmark samples are too small to estimate the chatbot refusal rate","why":"Sample size matters, but isolated refusal does not establish safety of tool use."},{"text":"The model output is valid JSON but the action API accepts all fields","why":"Output validation and API authorization are system concerns; the option is a possible symptom rather than the broader testing distinction."}],"takeaway":"Evaluate the actual action path and controls.","source":"atlas"},{"id":"430ac0c845d3","domain":"Testing and red teaming","level":"E","stem":"Why is a held-out test set necessary when refining prompt defenses?","choices":[{"text":"Reused probes can overfit the tested defense","why":"Adaptive optimization can contaminate evaluation"},{"text":"Held-out tests prevent all attacks","why":"They improve measurement, not eliminate vulnerabilities"},{"text":"An unseen test set forces deterministic answers","why":"Evaluation does not set decoding mode"},{"text":"Every public benchmark is legally prohibited","why":"No such general prohibition exists"}],"takeaway":"Keep some scenarios unseen until acceptance testing.","source":"atlas"},{"id":"f8cdc37fec2c","domain":"Testing and red teaming","level":"A","stem":"Two red teams report different injection success rates. Which difference most affects comparability?","choices":[{"text":"Matched attacker capabilities and attempt budgets","why":"Success is conditional on the threat model"},{"text":"Whether the attack prompts were grammatically identical","why":"Prompt equality alone does not equalize tools and attacker permissions"},{"text":"Whether both teams used the same foundation-model provider","why":"Provider parity alone does not equalize success criteria and budgets"},{"text":"Whether testers used identical laptop brands","why":"Hardware brand usually has little bearing"}],"takeaway":"Specify scope, budgets, constraints and success definitions.","source":"atlas"},{"id":"832903bd29cb","domain":"Testing and red teaming","level":"A","stem":"A filter rejects all 200 attack strings from a public benchmark, but a live attacker succeeds quickly. Why is this unsurprising?","choices":[{"text":"Adaptive attackers find untested workflows and bypasses","why":"Static sets do not represent open-ended adversaries"},{"text":"Benchmarks never have any useful value","why":"They can provide reproducible baselines"},{"text":"The model must have retrained itself in production","why":"Not required for adaptive bypass"},{"text":"The public test set may omit tool-mediated attack surfaces","why":"Real integrations can create paths absent from static input tests"}],"takeaway":"Use adaptive end-to-end tests and track attack coverage.","source":"atlas"},{"id":"3b5664440632","domain":"Testing and red teaming","level":"D","stem":"You are designing a test suite for a purchasing agent. Which cases provide strongest safety coverage?","choices":[{"text":"Fraud, replay and approval-bypass tests","why":"Each probes a different boundary and side effect"},{"text":"Only five requests phrased politely","why":"No adversarial or failure coverage"},{"text":"Only reasoning benchmark questions","why":"They don't verify transaction controls"},{"text":"Only a model-generated self-evaluation","why":"Independent system tests are needed"}],"takeaway":"Test invariants across identity, content, state and operational failure.","source":"atlas"},{"id":"e512e7a61ab8","domain":"Testing and red teaming","level":"D","stem":"An AI-assisted SOC tool can propose firewall changes. How should its red team validate the guardrails?","choices":[{"text":"API tampering and approval-bypass tests","why":"The key question is whether unsafe changes can execute"},{"text":"Only ask the model to explain firewall terminology","why":"Concept knowledge doesn't validate enforcement"},{"text":"Only count blocked profanity","why":"Not a meaningful threat for firewall writes"},{"text":"Run tests in production with no rollback plan","why":"Unsafe test design increases risk"}],"takeaway":"Test deterministic controls under adversarial tool inputs.","source":"atlas"},{"id":"5e348f65fe52","domain":"Testing and red teaming","level":"V","stem":"A leadership team wants one red-team severity score. What evidence makes it trustworthy?","choices":[{"text":"Reproducible attack with demonstrated harm","why":"Severity is scenario-dependent"},{"text":"Prompt cleverness as judged by the reviewer","why":"Creativity is not consequence"},{"text":"Model refusal frequency alone","why":"Refusals don't establish action-level safety"},{"text":"Number of tokens used in the attack","why":"Tokens are not a direct impact metric"}],"takeaway":"Score exploitable impact and control failure separately.","source":"atlas"},{"id":"1e103cb986fb","domain":"Testing and red teaming","level":"V","stem":"An evaluation suite flags no incidents during a 30-day pilot. Which conclusion is justified?","choices":[{"text":"Tests found no incidents, but can't prove that none exist","why":"Rare events and undetected failures remain possible"},{"text":"Conclude the design meets its security objectives because the pilot completed without incidents","why":"A quiet pilot offers limited evidence unless testing coverage and detection probability are understood."},{"text":"Extend the pilot to 90 days without changing its threat scenarios or detection controls","why":"More time improves exposure but does not necessarily challenge the missing attack paths."},{"text":"Estimate the system's worst-case failure rate as zero for observed workflows","why":"Zero observations do not justify zero underlying failure risk, especially for rare outcomes."}],"takeaway":"Report uncertainty and what instrumentation could miss.","source":"atlas"},{"id":"db79dafcece2","domain":"Reliability and safety engineering","level":"E","stem":"An LLM produces valid JSON with a plausible but incorrect bank account number. Which property is missing?","choices":[{"text":"The bank number must be right, not just valid JSON","why":"A parser only verifies shape"},{"text":"The output schema needs a stricter account-number regular expression","why":"A regex can enforce formatting but not that the account belongs to the intended payee."},{"text":"The answer needs more source citations to explain the account selection","why":"Citations might help review but do not substitute for validating the account against an authoritative record."},{"text":"The model's confidence threshold is too permissive for this transaction","why":"Confidence cannot independently prove a bank-account identifier is correct or authorized."}],"takeaway":"Validate meaning and authoritative state, not merely parseability.","source":"nist"},{"id":"7c1799c456af","domain":"Reliability and safety engineering","level":"E","stem":"Why are idempotency keys important when an agent retries a payment API call?","choices":[{"text":"Prevent double payments after retries","why":"Agents can repeat calls after ambiguous failures"},{"text":"They encrypt API requests end-to-end","why":"Not their purpose"},{"text":"They make model reasoning deterministic","why":"Retry safety is an application property"},{"text":"They replace authentication","why":"An idempotency key is not an identity claim"}],"takeaway":"Design side-effecting tools for uncertain, repeated model behavior.","source":"nist"},{"id":"437666b52c69","domain":"Reliability and safety engineering","level":"A","stem":"An agent times out after initiating a transfer and is unsure whether it succeeded. What is the correct recovery?","choices":[{"text":"Check authoritative transaction status before retrying","why":"Uncertain acknowledgments should not trigger duplicate writes"},{"text":"Repeat immediately using a new key","why":"A new key can duplicate the transfer"},{"text":"Ask the LLM to guess whether the call went through","why":"Inference cannot establish execution truth"},{"text":"Mark the transfer failed solely because of a timeout","why":"The server may have committed it"}],"takeaway":"Resolve ambiguous outcomes against the source of truth.","source":"nist"},{"id":"6761314ceb43","domain":"Reliability and safety engineering","level":"A","stem":"A model's answer quality remains high but average response time triples on long inputs. What should be analyzed?","choices":[{"text":"Token lengths, tool latency and tail metrics","why":"Latency can vary by context and dependencies"},{"text":"Only its benchmark accuracy","why":"Accuracy cannot explain runtime latency"},{"text":"Whether input tokens grew while output tokens stayed constant","why":"That is useful, but still needs stage-by-stage timings to locate the bottleneck"},{"text":"Only the overall mean latency, rather than tail latency and stage timings","why":"Mean latency alone can hide slow long-input or tool-call paths"}],"takeaway":"Inspect end-to-end stage timings and p95/p99 behavior.","source":"nist"},{"id":"4c5aed3493c0","domain":"Reliability and safety engineering","level":"D","stem":"A safety-critical assistant loses its retrieval service during an outage. What failure mode is safest?","choices":[{"text":"Halt decisions lacking verified source evidence","why":"Availability goals should not override correctness boundaries"},{"text":"Generate answers from parametric memory and present them as sourced","why":"Fabricated provenance creates risk"},{"text":"Silently reuse arbitrarily stale documents forever","why":"Old policy can become invalid"},{"text":"Grant broad tool permissions to work around missing retrieval","why":"Permissions do not fix missing evidence"}],"takeaway":"Define fail-open versus fail-closed per consequence and workflow.","source":"nist"},{"id":"d51b16dae9b1","domain":"Reliability and safety engineering","level":"D","stem":"An agent updates CRM, sends email, then fails billing. How should workflow integrity be designed?","choices":[{"text":"Log each step, reverse what is reversible and flag the rest","why":"Multi-system actions cannot be assumed atomic"},{"text":"Rerun the entire plan without checking prior effects","why":"Repeats can duplicate earlier actions"},{"text":"Let the model forget the transaction and restart","why":"Lost state makes consistency worse"},{"text":"Require all tools to share one database without exceptions","why":"Not always feasible across SaaS systems"}],"takeaway":"Handle partial completion with explicit state and recovery semantics.","source":"nist"},{"id":"7f302cfefe8d","domain":"Reliability and safety engineering","level":"V","stem":"A pilot meets 99.9% availability but sometimes generates false compliance attestations. What is the executive decision?","choices":[{"text":"Hold release until false attestations are fixed","why":"Availability does not compensate for dangerous false assertions"},{"text":"Approve because the SLA threshold was met","why":"Different dimensions require different acceptance"},{"text":"Increase the uptime target to 99.99%","why":"Does not prevent false attestation"},{"text":"Focus the launch review only on user sentiment","why":"Users may not detect consequential mistakes"}],"takeaway":"Acceptance needs safety and assurance metrics as well as reliability.","source":"nist"},{"id":"afce1ea6b099","domain":"Reliability and safety engineering","level":"V","stem":"A team proposes 100% human review of low-risk summaries to guarantee safety. What tradeoff should you surface?","choices":[{"text":"Review capacity, error rates, risk stratification and selective escalation must be evaluated","why":"Humans can err and blanket review may be unsustainable"},{"text":"Keep universal human review until the first quarter of incident data is available","why":"Universal review may add delay and reviewer fatigue without focusing on highest-consequence cases."},{"text":"Randomly sample 10% of outputs for review, regardless of use case or severity","why":"Uniform sampling may miss the small class of high-impact errors requiring mandatory control."},{"text":"Automate every low-confidence case and review high-confidence cases to optimize reviewer time","why":"Confidence needs calibration to consequence; high-confidence mistakes may still be damaging."}],"takeaway":"Allocate human attention by risk and provide supporting evidence.","source":"nist"},{"id":"fd0822ac88e8","domain":"Monitoring and incident response","level":"E","stem":"What is the best evidence that an AI agent actually changed a record?","choices":[{"text":"Logs from the actual system that was changed","why":"Generated text is not execution proof"},{"text":"The assistant's tool-call request showing the intended record ID and payload","why":"An intent to invoke a tool does not prove the mutation succeeded."},{"text":"The model's confidence estimate that its CRM update was successful","why":"A self-assessment is not authoritative execution evidence."},{"text":"A UI notification issued when the agent dispatched the API request","why":"Dispatch can precede rejection, rollback or partial failure; the system of record confirms the effect."}],"takeaway":"Bind AI traces to real downstream operations.","source":"atlas"},{"id":"b8ccefee9ec8","domain":"Monitoring and incident response","level":"E","stem":"Why should AI security logs capture retrieval document IDs and tool calls?","choices":[{"text":"Trace source, authorization and tool activity","why":"Incidents may span sources and systems"},{"text":"They guarantee the model will never hallucinate","why":"Logging is detective evidence, not prevention"},{"text":"They eliminate data-retention obligations","why":"Logs can themselves hold sensitive material"},{"text":"They replace identity-provider logs","why":"Cross-system correlation is still needed"}],"takeaway":"Log enough lineage to reconstruct decisions without indiscriminate data retention.","source":"atlas"},{"id":"0fba07e52f6a","domain":"Monitoring and incident response","level":"A","stem":"A model begins suggesting a previously unseen phishing domain, and relevant retrieval pages were recently edited. Where do you start?","choices":[{"text":"Correlate page revisions, retrieval hits, prompts and tool/network activity","why":"A source compromise may explain new behavior"},{"text":"Reinstall every employee laptop immediately","why":"Evidence is too narrow for that response"},{"text":"Assume the foundation model changed its weights","why":"Source edits are a more direct hypothesis"},{"text":"Use a broader instruction prompt without inspecting retrieved sources","why":"Prompt changes do not explain or contain poisoned data"}],"takeaway":"Trace the provenance of model-visible content and consequences.","source":"atlas"},{"id":"bad4804dcb11","domain":"Monitoring and incident response","level":"A","stem":"An AI-based support bot sends customer data to an external address. Which first response is best?","choices":[{"text":"Stop egress, preserve logs and secure tokens","why":"Stop harm while retaining evidence"},{"text":"Delete all logs to avoid retaining PII","why":"Destroys the incident record"},{"text":"Immediately publish a total breach count without scoping","why":"Scope requires evidence"},{"text":"Only retrain the model and return to production","why":"Retraining does not contain tool-based exfiltration"}],"takeaway":"Contain, preserve, scope and then remediate the broken boundary.","source":"atlas"},{"id":"2b870a838ab0","domain":"Monitoring and incident response","level":"D","stem":"An organization runs hundreds of AI assistants. What monitoring architecture scales best?","choices":[{"text":"Link identity, policy and tool-event logs","why":"End-to-end traceability reveals consequence"},{"text":"Store only aggregated daily token counts","why":"Volume data cannot reconstruct incidents"},{"text":"Keep all raw prompts indefinitely without access control","why":"Unbounded sensitive retention creates a new risk"},{"text":"Treat every refusal as a confirmed attack","why":"Refusals may be benign and not actionable"}],"takeaway":"Use structured correlated events with restricted retention.","source":"atlas"},{"id":"4d04cff63296","domain":"Monitoring and incident response","level":"D","stem":"A malicious document may have poisoned an agent's persistent memory. What containment is necessary?","choices":[{"text":"Quarantine the memory and trace what it influenced","why":"Deleting the original document may not clear durable influence"},{"text":"Remove the attacker file and assume all downstream state is clean","why":"Memory can preserve attack instructions"},{"text":"Retrain the foundation model without inspecting persistent memories","why":"A new model can still ingest poisoned retained state"},{"text":"Delete the original source but leave derived summaries unchanged","why":"Poisoned content may persist through summaries and caches"}],"takeaway":"Persistent agent state needs incident handling and provenance.","source":"atlas"},{"id":"750045898a41","domain":"Monitoring and incident response","level":"V","stem":"A CISO asks for a detection KPI for AI prompt-injection incidents. What is defensible?","choices":[{"text":"Measure confirmed impacts and tested detection coverage","why":"Counts require definitions and independent confirmation"},{"text":"Total user messages containing 'ignore previous'","why":"Keyword presence isn't synonymous with incidents"},{"text":"Number of vendors claiming AI security","why":"Not an outcome metric"},{"text":"Total chatbot sessions as an incident count","why":"Activity volume is not threat success"}],"takeaway":"Distinguish signals, attempts, control failures and realized impacts.","source":"atlas"},{"id":"2e1412721fa0","domain":"Monitoring and incident response","level":"V","stem":"A model provider reports a service-side data exposure. What drives your impact assessment?","choices":[{"text":"Which exact endpoints, regions, dates, logs and client records were in scope","why":"Shared-provider incidents vary by configured service and processing path"},{"text":"Use the vendor's incident classification and global affected-request count to determine local severity","why":"Vendor counts may not identify your exact exposed tenants, users or datasets."},{"text":"Inventory all integrations with the provider and assume each experienced the same loss","why":"An inventory scopes investigation but does not substitute for affected processing paths and dates."},{"text":"Prioritize determining whether the model weights were compromised before examining logs","why":"Service-side data exposure can involve prompts or logs without any model-weight compromise."}],"takeaway":"Use contractual data-flow and inventory evidence to scope affected workloads.","source":"atlas"},{"id":"3134a9454478","domain":"Governance operating model","level":"E","stem":"Which is the clearest distinction between AI policy and AI procedure?","choices":[{"text":"A policy states what; a procedure says how","why":"Governance needs both intent and repeatable execution"},{"text":"Policy records individual task sequences while procedures capture risk tolerance","why":"This reverses the general allocation of requirements and implementation steps."},{"text":"Policies govern only executives while procedures govern technical teams","why":"Both can apply to any role; the difference is type of direction, not audience."},{"text":"Procedure compliance creates policy automatically once a control is automated","why":"A technically implemented process does not itself establish formal organizational obligations."}],"takeaway":"Keep principles, decision rules and operational steps connected.","source":"nist"},{"id":"252cc6bdc035","domain":"Governance operating model","level":"E","stem":"An AI governance committee approves a system but no one operates controls afterward. What's the missing element?","choices":[{"text":"Assigned control owners and lifecycle monitoring","why":"Approval is a decision, not continuous governance"},{"text":"A formal sign-off template with no assigned runtime owner","why":"A better approval record does not operate controls afterward"},{"text":"More one-time vendor certifications","why":"Those do not replace ownership"},{"text":"A higher meeting frequency alone","why":"Meetings do not guarantee execution"}],"takeaway":"Governance includes operation, evidence and escalation—not just permission.","source":"nist"},{"id":"f82b1f7ae303","domain":"Governance operating model","level":"A","stem":"A client requires all AI uses to go through one weekly committee, causing shadow use. What is the operating-model flaw?","choices":[{"text":"Missing risk-tiered and delegated decision authority","why":"Low-risk traffic can swamp oversight and induce bypass"},{"text":"Security policy is unnecessary for AI","why":"Controls remain necessary"},{"text":"The organization has too many model providers by definition","why":"The bottleneck may be process design"},{"text":"Every user must join the committee","why":"That would intensify the problem"}],"takeaway":"Use risk-based intake and preapproved patterns with escalation.","source":"nist"},{"id":"e2492a1b154e","domain":"Governance operating model","level":"A","stem":"An approved AI workflow adds a new CRM write tool. What governance trigger should apply?","choices":[{"text":"Review newly reachable actions and changed privileges","why":"New tools can alter risk even when the model is unchanged"},{"text":"No review until the annual renewal","why":"Potential impacts change immediately"},{"text":"Only a vendor reassessment, without reassessing new permissions","why":"The client's own new tool can change authority regardless of vendor status"},{"text":"A full audit of unrelated systems only","why":"Scope should follow the changed trust boundary"}],"takeaway":"Define review triggers based on risk-altering changes.","source":"nist"},{"id":"5578e64d4f26","domain":"Governance operating model","level":"D","stem":"You are establishing AI governance at a university with limited resources. What is the best minimum viable structure?","choices":[{"text":"A use-case inventory, owners, risk tiers and escalation","why":"It enables decisions and oversight without a large bureaucracy"},{"text":"An exhaustive policy before any pilot may exist","why":"This can stall learning and encourage shadow AI"},{"text":"Central committee approval for every experiment","why":"Not proportionate to low-risk activity"},{"text":"Buy a full GRC platform before assigning owners","why":"Tools cannot replace governance design"}],"takeaway":"Start with clear decision rights and a modest audit trail.","source":"nist"},{"id":"2ed339d97f56","domain":"Governance operating model","level":"D","stem":"A business wants exceptions for sensitive-data AI use. What exception record is best?","choices":[{"text":"Scope, safeguards, owner and expiry","why":"Exceptions need enforceable boundaries and end states"},{"text":"An indefinite email saying 'approved'","why":"No lifecycle or scope control"},{"text":"A model-generated note without human decision","why":"The accountable authority is missing"},{"text":"A blanket exemption for a department","why":"Too broad to assess specific risk"}],"takeaway":"Exceptions are bounded risk decisions, not alternate permanent policy.","source":"nist"},{"id":"9add2b05e5ca","domain":"Governance operating model","level":"V","stem":"The CAIO asks whether AI governance is working. Which measures are strongest?","choices":[{"text":"Decisions, control coverage and exceptions","why":"Balances adoption, execution and unresolved risk"},{"text":"Number of governance meetings only","why":"Meetings are an input, not an outcome"},{"text":"Number of policies produced","why":"Document volume doesn't show adoption"},{"text":"Count of approvals without rejection context","why":"Approvals may obscure risk and process bypass"}],"takeaway":"Measure both decision throughput and control effectiveness.","source":"nist"},{"id":"3ba53bd40be3","domain":"Governance operating model","level":"V","stem":"A CISO and CAIO disagree about who approves a high-risk agent. What deliverable resolves it?","choices":[{"text":"A RACI/decision-rights model with risk thresholds, escalation and recorded risk acceptance","why":"Clear authority prevents stalled or unauthorized decisions"},{"text":"Assign the CISO technical approval and the CAIO business approval, then require both signatures always","why":"Fixed dual approval can create deadlock and still leave residual-risk ownership unclear."},{"text":"Delegate final approval to the architecture review board for every risk tier","why":"A board can facilitate review, but authority and risk-acceptance thresholds must be explicit."},{"text":"Ask business owners to certify the model and security officers to monitor it afterward","why":"This oversimplifies high-risk action authority and exception ownership."}],"takeaway":"Separate advisory review, approval authority and accountable risk ownership.","source":"nist"},{"id":"13cc20436bfb","domain":"Frameworks and standards","level":"E","stem":"NIST AI RMF has four core functions. Which correctly describes their relationship?","choices":[{"text":"Govern is cross-cutting; Map contextualizes; Measure assesses; Manage acts on risk","why":"The framework organizes risk-management outcomes rather than a strict waterfall"},{"text":"Govern and Map are completed during project intake; Measure and Manage apply only after launch","why":"The functions are iterative and are not restricted to single lifecycle phases."},{"text":"Map produces the legal requirements; Measure chooses the controls; Manage performs independent audits","why":"This misstates the functions and treats legal interpretation and auditing as rigid single-function steps."},{"text":"Govern is the risk treatment stage; Manage is the oversight function for the whole organization","why":"Govern establishes organizational practices; Manage is where identified risks are prioritized and acted on."}],"takeaway":"Use the framework as lifecycle risk management, not a checklist order.","source":"nist"},{"id":"0f0a1a577ce9","domain":"Frameworks and standards","level":"E","stem":"How does ISO/IEC 42001 differ from an attack taxonomy such as MITRE ATLAS?","choices":[{"text":"ISO 42001 manages AI; ATLAS catalogs adversary techniques","why":"They answer governance versus threat-behavior questions"},{"text":"ISO 42001 is an ML exploit database","why":"It is a management system standard"},{"text":"ATLAS certifies an organization's management process","why":"It is not an AIMS certification scheme"},{"text":"Both mandate the same cloud architecture controls","why":"Neither defines one vendor stack"}],"takeaway":"Combine governance requirements with threat-informed technical evidence.","source":"nist"},{"id":"9dd644f83967","domain":"Frameworks and standards","level":"A","stem":"A supplier maps every security finding to the OWASP LLM Top 10 and claims full regulatory compliance. What's the defect?","choices":[{"text":"Attack categories alone do not establish regulatory compliance","why":"Mappings are useful but insufficient evidence of obligations"},{"text":"OWASP is never relevant to LLM systems","why":"It is highly relevant for application risks"},{"text":"A mapping must always contain exactly ten controls","why":"Categories do not prescribe fixed control counts"},{"text":"Only international standards may be used in security reviews","why":"Different tools serve different purposes"}],"takeaway":"State what each framework measures and what it does not.","source":"nist"},{"id":"9ab6d30e3af9","domain":"Frameworks and standards","level":"A","stem":"A team applies NIST AI RMF and reports 'Manage completed.' What's conceptually wrong?","choices":[{"text":"Risk management continues as systems evolve","why":"The functions are continuous, not one-time milestones"},{"text":"The framework requires seven functions instead","why":"The core has four"},{"text":"Only regulators are allowed to use the framework","why":"It is broadly usable"},{"text":"Manage is exclusively an incident-response action","why":"It covers risk prioritization and treatment more broadly"}],"takeaway":"Treat governance and assessment as an ongoing cycle.","source":"nist"},{"id":"117b838ae77d","domain":"Frameworks and standards","level":"D","stem":"A client wants one control crosswalk for AI risk, security testing and management-system audit. Which approach is strongest?","choices":[{"text":"Trace requirements to normative sources, controls and evidence","why":"Crosswalks aid reuse while preserving each source's scope"},{"text":"Declare all frameworks identical once they share a keyword","why":"Superficial overlaps do not imply equivalence"},{"text":"Use only one framework for every question","why":"No single source covers all dimensions"},{"text":"Track only vendor certification badges","why":"Badges are not an implementation crosswalk"}],"takeaway":"Maintain traceability from obligations through controls to evidence.","source":"nist"},{"id":"b50bdcf52cca","domain":"Frameworks and standards","level":"D","stem":"A threat-modeling team wants to combine OWASP and MITRE ATLAS. What division of labor is most useful?","choices":[{"text":"OWASP categorizes risks; ATLAS describes adversary techniques","why":"They provide complementary views"},{"text":"Use OWASP as an identity provider and ATLAS as a firewall","why":"Neither is a runtime control"},{"text":"Use ATLAS to authorize production requests","why":"Threat taxonomies do not make access decisions"},{"text":"Translate every ATLAS technique into an automatic compliance pass","why":"Technique coverage is not regulatory compliance"}],"takeaway":"Map attack patterns to implemented mitigations and tests.","source":"nist"},{"id":"36933ac62c8c","domain":"Frameworks and standards","level":"V","stem":"A board asks whether ISO 42001 certification proves an AI system cannot be compromised. What should you say?","choices":[{"text":"Management certification does not guarantee system immunity","why":"Certification can support assurance without eliminating residual risk"},{"text":"It mathematically proves every deployment safe","why":"No management-system standard promises that"},{"text":"It is only a software vulnerability scanner","why":"The standard is organizational"},{"text":"Its scope is automatically every vendor feature purchased","why":"Scope must be verified"}],"takeaway":"Disclose the certification boundary and complement it with technical evidence.","source":"nist"},{"id":"7331ba63abf2","domain":"Frameworks and standards","level":"V","stem":"A client wants a list of 'mandatory OWASP LLM controls.' How should the consultant frame it?","choices":[{"text":"OWASP is risk guidance, not binding law in itself","why":"OWASP publications are community security guidance"},{"text":"Map every OWASP risk category directly to one mandatory compensating control","why":"Category names identify risks, not universal controls or sufficient acceptance criteria."},{"text":"Use OWASP categories as contractual acceptance criteria without tailoring their applicability","why":"Contracts can adopt them, but categories require contextual, measurable controls and tests."},{"text":"Treat the OWASP list as a prioritization ranking that overrides client-specific threat modeling","why":"Published rankings do not encode a particular client's data, actions and attack paths."}],"takeaway":"Separate normative requirements from recommended security practice.","source":"nist"},{"id":"d274228158ba","domain":"Responsible AI and human factors","level":"E","stem":"A hiring model is accurate overall but has much higher false rejection rates for one subgroup. What is the key concern?","choices":[{"text":"Aggregate accuracy can conceal unequal error burdens and resulting harm","why":"Fairness assessment needs subgroup and context analysis"},{"text":"The main issue is lack of demographic parity even if error costs differ across groups","why":"Parity can be one lens, but group-level false-rejection impact requires context, harm and tradeoff analysis."},{"text":"The model likely has poor calibration, so a single global threshold should be adjusted","why":"Calibration and thresholds may help, but the subgroup harm and root cause require investigation."},{"text":"High aggregate accuracy is sufficient if the model had balanced training categories","why":"Balanced training does not ensure equal subgroup outcomes in representative deployment data."}],"takeaway":"Measure consequential errors across affected groups.","source":"nist"},{"id":"98049e10b634","domain":"Responsible AI and human factors","level":"E","stem":"A user accepts a confident AI explanation despite weak evidence. Which human factor is most relevant?","choices":[{"text":"Automation bias and overreliance on fluent outputs","why":"Presentation can distort human judgment"},{"text":"A cryptographic collision","why":"No cryptography is implicated"},{"text":"A model inversion attack","why":"No training-membership information is sought"},{"text":"A weak user training program as the sole explanation","why":"Education may help, but fluent interfaces create systematic reliance risks"}],"takeaway":"Design interfaces that show uncertainty and encourage verification.","source":"nist"},{"id":"ecb1d6c7e527","domain":"Responsible AI and human factors","level":"A","stem":"A model used for triage performs differently across hospitals. What should be examined before declaring it biased?","choices":[{"text":"Population shifts, labeling and subgroup harms","why":"Shift and bias may interact and need causal investigation"},{"text":"Only the hospital's model version without inspecting data differences","why":"Version parity does not rule out population or labeling shift"},{"text":"Only whether demographic variables were excluded","why":"Proxies can remain and exclusion can hide disparities"},{"text":"Assume statistical parity is required for every clinical outcome","why":"Fairness metrics depend on context and clinical validity"}],"takeaway":"Choose fairness measures tied to the decision and plausible harms.","source":"nist"},{"id":"5ec291873a22","domain":"Responsible AI and human factors","level":"A","stem":"A generative assistant provides a correct recommendation but invents the reasoning and cites irrelevant sources. What's the issue?","choices":[{"text":"Fabricated rationale and citations","why":"A right conclusion with false rationale can mislead oversight"},{"text":"Only syntactic validity","why":"The prose may be well-formed"},{"text":"The user's authorization role","why":"No disclosure boundary is described"},{"text":"A pure availability incident","why":"The system was available but misleading"}],"takeaway":"Assess evidence and reasoning claims separately from final answers.","source":"nist"},{"id":"20edc60aaef3","domain":"Responsible AI and human factors","level":"D","stem":"A university uses AI to flag academic misconduct. Which governance design best protects students?","choices":[{"text":"Human review, independent evidence and appeals","why":"High-stakes accusations need contestability"},{"text":"Allow automatic sanctions above a fixed confidence score","why":"Model scores cannot alone establish culpability"},{"text":"Hide all evidence to preserve detector secrecy","why":"Opacity undermines fair review"},{"text":"Evaluate only average model precision","why":"Individual harms and appeals also matter"}],"takeaway":"Human oversight must have authority and evidence, not merely a button.","source":"nist"},{"id":"2e1b43e79a3f","domain":"Responsible AI and human factors","level":"D","stem":"A support assistant must disclose uncertainty without overwhelming agents. What design balances usability and assurance?","choices":[{"text":"Show evidence, when to doubt it, and when to escalate","why":"Users need actionable verification signals"},{"text":"Show a generic 'AI may be wrong' banner only","why":"Habituation weakens broad warnings"},{"text":"Hide all confidence information for a cleaner interface","why":"Uncertainty can be decision-relevant"},{"text":"Show a numeric certainty score generated by the model without calibration","why":"Uncalibrated confidence creates false precision"}],"takeaway":"Tie uncertainty signals to evidence quality and action consequences.","source":"nist"},{"id":"ebcc95a85de3","domain":"Responsible AI and human factors","level":"V","stem":"A leadership team cites average satisfaction as proof that AI harms are negligible. What additional evidence should be requested?","choices":[{"text":"Subgroup harms, incidents and appeal paths","why":"Positive averages can conceal concentrated harm"},{"text":"Only total daily query count","why":"Volume doesn't characterize harm"},{"text":"Only an overall task-completion benchmark","why":"Aggregate success misses distribution and serious harms"},{"text":"Only an engineering velocity metric","why":"Speed can rise while harm remains"}],"takeaway":"Balance utility with measured downstream and distributional impacts.","source":"nist"},{"id":"c808ad47f69f","domain":"Responsible AI and human factors","level":"V","stem":"An AI deployment raises accessibility concerns for multilingual users. What should the assessment include?","choices":[{"text":"Language-specific quality, error consequences, usable alternatives and feedback routes","why":"Performance and support vary by population"},{"text":"Validate the system using a representative multilingual benchmark and report average accuracy","why":"Aggregate metrics can conceal language-specific harm, accessibility failures and unsafe fallbacks."},{"text":"Offer translated instructions for the product while keeping its model evaluation in English","why":"UI localization does not establish model behavior and safety across languages."},{"text":"Use customer support tickets to prioritize any accessibility fixes after launch","why":"Reactive complaints may miss users who cannot access the service or report failures."}],"takeaway":"Test affected user journeys and provide non-AI fallback paths.","source":"nist"},{"id":"c7c672be9341","domain":"Legal, regulatory and contractual risk","level":"E","stem":"Which statement about legal obligations for an AI project is most accurate?","choices":[{"text":"They depend on jurisdiction, sector, role, data and use case, not just the model label","why":"A legal applicability assessment begins with processing and impact"},{"text":"The same privacy rules apply to every AI application using a hosted foundation model","why":"Jurisdiction, contractual role and data context can differ even on the same platform."},{"text":"Vendor compliance certifications transfer the complete legal analysis to the provider","why":"Shared responsibility and customer use-case obligations remain."},{"text":"Requirements are fixed by whether the system has a chat interface versus a classification endpoint","why":"Interface type does not determine the governing sector, data or processing roles."}],"takeaway":"Map applicable duties to actual use, not generic AI terminology.","source":"nist"},{"id":"6a01c5ee3ab9","domain":"Legal, regulatory and contractual risk","level":"E","stem":"A US hospital uses AI SaaS that receives ePHI. What is a necessary contract-and-workflow consideration?","choices":[{"text":"BAA scope and ePHI processing safeguards","why":"A feature-specific BAA and safeguards can be necessary"},{"text":"A model's refusal policy is equivalent to a BAA","why":"Prompts are not contracts"},{"text":"Any public cloud provider is prohibited from handling ePHI","why":"Cloud services can be used under appropriate arrangements"},{"text":"Encryption automatically removes HIPAA obligations","why":"Encrypted ePHI can remain regulated information"}],"takeaway":"Contract scope, safeguards and the precise data flow must align.","source":"nist"},{"id":"0da25ebeb983","domain":"Legal, regulatory and contractual risk","level":"A","stem":"An AI vendor claims EU AI Act conformity for every deployment because its foundation model has paperwork. What is missing?","choices":[{"text":"The deployment's purpose, risk tier and legal duties","why":"Provider documentation does not answer every deployer requirement"},{"text":"EU laws apply identically outside all EU contexts","why":"Territorial reach must be assessed"},{"text":"All general-purpose AI systems are automatically prohibited","why":"The Act distinguishes roles and risk categories"},{"text":"A model card is a substitute for contract due diligence","why":"Operational and legal scope still matter"}],"takeaway":"Distinguish provider-level and deployment-specific responsibilities.","source":"nist"},{"id":"5f1fa36afd55","domain":"Legal, regulatory and contractual risk","level":"A","stem":"A vendor BAA covers its enterprise chat but not an optional external search connector. What's the first control decision?","choices":[{"text":"Restrict the connector pending verified BAA and data-flow scope","why":"Add-on processing may fall outside the covered service"},{"text":"Assume the enterprise product name extends the BAA to all features","why":"Scope may differ"},{"text":"Ask users to remove patient names while keeping identifiers","why":"Partial redaction may still expose ePHI"},{"text":"Disable prompt history but leave connector network calls unchanged","why":"History retention settings do not prevent outbound processing"}],"takeaway":"Use controls tied to precise contractual service boundaries.","source":"nist"},{"id":"6ec70d316a6f","domain":"Legal, regulatory and contractual risk","level":"D","
