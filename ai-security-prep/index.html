:root{color-scheme:dark;--bg:#081524;--bg2:#0b1b2b;--card:#11263a;--card2:#172e44;--line:#284258;--txt:#eff7ff;--muted:#a8bfd1;--blue:#5cbcf3;--green:#67d7b2;--red:#fa9a93;--amber:#eac78b;--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 1100px 550px at 45% -130px,#13334c,transparent 70%),var(--bg);color:var(--txt);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.45}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.44;cursor:not-allowed}a{color:#8cd6ff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a7e1ff;outline-offset:3px}.shell{max-width:1040px;margin:auto;padding:0 18px 112px}.top{padding:18px 0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.glyph{background:linear-gradient(135deg,#5bc5dc,#4068c8);height:39px;width:39px;display:grid;place-items:center;border-radius:12px;color:#061527;font-weight:900;font-size:20px}.brand b{font-size:17px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted);background:#14283a}.hero{border-radius:24px;background:linear-gradient(132deg,#174364,#10283d 65%,#152a40);border:1px solid #2e5c74;padding:26px 24px;box-shadow:0 12px 45px #02071035}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8dcf5;font-weight:800}.hero h1{margin:9px 0 12px;font-size:clamp(27px,5vw,41px);line-height:1.1;letter-spacing:-.04em}.hero p{color:#c4dceb;margin:0 0 20px;max-width:660px}.accent{color:#99ddff}.btn{border:1px solid transparent;background:#60c5f4;color:#071c2e;padding:12px 17px;border-radius:13px;font-weight:800;min-height:46px;transition:transform .1s,background .1s}.btn:active{transform:scale(.985)}.btn.secondary{background:#18354b;color:#e5f5ff;border-color:#426078}.btn.ghost{background:transparent;color:#b9d9ee;border-color:#31516b}.btn.danger{color:#ffb1a8;border-color:#70413f;background:transparent}.btn.sm{min-height:39px;padding:8px 12px;font-size:13px}.btn.wide{width:100%}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:29px 0 12px}.sectionhead h2{margin:0;font-size:18px;letter-spacing:-.02em}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:19px;border:1px solid var(--line);border-radius:17px;background:#102437}.metric strong{font-size:28px;letter-spacing:-.03em;display:block}.metric span{font-size:12px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;margin:12px 0}.panel h3{margin:0 0 8px;font-size:16px}.panel p{margin:8px 0;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #33536b;color:#b8cfe0;background:#102537;border-radius:999px;padding:9px 14px;min-height:40px;font-size:13px}.chip[aria-pressed=true]{background:#174b64;color:#e8faff;border-color:#70bfe1;box-shadow:inset 0 0 0 1px #5db5db}.selectbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:290px;overflow:auto;padding:4px}.dom{display:flex;align-items:center;gap:9px;border:1px solid #29435a;border-radius:11px;padding:11px;min-height:45px;background:#0d2030;color:#d9eaf7;font-size:13px}.dom input{accent-color:#68c6ef;width:17px;height:17px;flex-shrink:0}.dom span{line-height:1.25}.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field select{border:1px solid #406076;border-radius:10px;color:#ecf5fc;background:#122b3f;padding:10px;min-height:45px}.progress-track{height:8px;background:#254054;border-radius:50px;overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#5bc2ed,#66d4b3);transition:width .2s}.qwrap{max-width:740px;margin:0 auto}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#adcadf;font-size:12px;font-weight:700;margin:12px 0 14px}.qtitle{font-size:clamp(21px,3.3vw,29px);line-height:1.38;letter-spacing:-.017em;margin:14px 0 22px}.option{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px 15px;min-height:62px;background:#11293f;color:var(--txt);border:1px solid #32516a;border-radius:14px;margin:9px 0;line-height:1.4}.letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border:1px solid #49677b;border-radius:9px;font-size:12px;color:#bfd4e4;font-weight:850}.option.selected{background:#214762;border-color:#6ccaf4;box-shadow:inset 0 0 0 1px #6ccaf4}.option.correct{background:#113f39;border-color:#5ed6a3}.option.incorrect{background:#493038;border-color:#f19189}.option.correct .letter{border-color:#61d2a9;color:#baf7dc}.option.incorrect .letter{border-color:#e8958e;color:#ffd5ce}.option:disabled{cursor:default;opacity:1}.answer{padding:20px;border-radius:16px;border:1px solid #2b5667;background:#0f2d40;margin-top:20px}.answer.good{border-color:#28795c;background:#0f322e}.answer.bad{border-color:#814d4c;background:#30272f}.answer h3{margin:0 0 10px}.answer .detail{color:#c6d9e8;line-height:1.6}.choicewhy{padding:12px 0;border-top:1px solid #315266}.choicewhy b{color:#f1f9ff}.choicewhy p{margin:4px 0 0;color:#b9d0de;font-size:13px}.book{border:0;background:none;color:#9fb9cc;font-size:21px;line-height:1;padding:8px;min-height:44px}.book.marked{color:#ffd58f}.nav{position:fixed;bottom:0;left:0;right:0;background:#091b2af2;border-top:1px solid #34506a;backdrop-filter:blur(16px);padding:10px max(15px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left));z-index:40}.navinner{max-width:600px;margin:auto;display:flex;justify-content:space-around}.navbutton{background:none;border:0;color:#8ba8bb;display:grid;gap:3px;place-items:center;min-width:64px;min-height:46px;font-size:11px;padding:4px 8px}.navbutton .ico{font-size:19px}.navbutton.active{color:#8dd9ff}.rank{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #284457}.rank:last-child{border:0}.rank .name{font-size:13px;font-weight:650}.rank small{display:block;color:var(--muted)}.bar{height:7px;background:#234158;border-radius:30px;margin-top:7px;overflow:hidden;width:100%}.bar i{display:block;height:100%;background:#67c8e9;border-radius:inherit}.right{text-align:right}.empty{padding:40px 18px;border:1px dashed #385a70;border-radius:16px;color:var(--muted);text-align:center}.empty h3{color:var(--txt)}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.statrow{border:1px solid #284459;border-radius:13px;background:#102536;padding:13px}.statrow .n{font-size:24px;font-weight:800}.statrow .l{font-size:12px;color:var(--muted)}.notice{border-left:3px solid #5fbfe5;background:#152d40;color:#bed7e6;border-radius:8px;padding:12px 14px;font-size:13px}.link{background:none;border:none;padding:5px;color:#98dafe;font-weight:650}.hr{border:0;border-top:1px solid #29475b;margin:19px 0}details{border:1px solid #304e64;border-radius:13px;background:#10283a;margin-top:12px;padding:12px}summary{cursor:pointer;font-weight:700}.finishscore{font-size:56px;font-weight:900;line-height:1}.ref{display:inline-block;border:1px solid #375970;border-radius:9px;padding:8px 11px;margin:9px 5px 4px 0;text-decoration:none;font-size:12px}.fixedactions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}.fixedactions .btn{flex:1}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#d1f0fa;color:#0e2c3c;border-radius:12px;font-weight:700;z-index:100;box-shadow:0 5px 25px #0007;max-width:90%;display:none}.newbadge{font-size:11px;color:#a8e3fb}.hline{height:1px;background:#2c475b;margin:16px 0}.footnote{font-size:11px;color:#8ca7b9;margin:18px 0}.chartbar{display:flex;gap:3px;align-items:end;height:75px;margin:14px 0}.chartbar span{background:#5dbfe8;flex:1;min-height:2px;border-radius:5px 5px 0 0;opacity:.85}@media(max-width:620px){.shell{padding:0 14px 112px}.hero{padding:23px 18px}.grid{gap:8px}.metric{padding:14px 11px}.metric strong{font-size:23px}.two{grid-template-columns:1fr}.selectbox{grid-template-columns:1fr}.panel{padding:15px}.option{padding:14px 12px}.qhead{flex-wrap:wrap}.brand b{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

const BANK=[{"id":"a7ed041089c3","domain":"ML foundations","level":"E","stem":"A fraud classifier has 99% accuracy on data with 0.5% fraud. What is the strongest reason not to treat accuracy as security evidence?","choices":[{"text":"A trivial always-negative model can exceed 99% accuracy while missing every fraud case","why":"Class prevalence makes accuracy hide the false-negative cost"},{"text":"Report precision at a 0.5 decision threshold because false positives are the primary cost","why":"Precision alone does not show how many rare fraud cases were missed, and the cost profile has not been established."},{"text":"Evaluate AUC instead of accuracy because a threshold-independent measure is sufficient for launch","why":"AUC provides discrimination information but does not set an operational threshold or quantify costly false negatives."},{"text":"Rebalance the evaluation set to 50% fraud and compare raw accuracy across models","why":"A balanced set can help diagnosis, but its accuracy is not representative of live prevalence or operational loss."}],"takeaway":"Look at the confusion matrix and decision costs before selecting a metric.","source":"nist"},{"id":"ef15467d48af","domain":"ML foundations","level":"E","stem":"A team reports low training loss and near-random results on an independent recent sample. Which distinction best explains the gap?","choices":[{"text":"Generalization rather than optimization is failing","why":"Training fit says little about novel population performance"},{"text":"The optimizer necessarily failed to converge","why":"Low training loss is evidence against that specific diagnosis"},{"text":"Data encryption degraded the model's gradients","why":"Nothing indicates cryptographic processing of training data"},{"text":"The validation sample may have been unintentionally included in training","why":"That would normally inflate test performance, not explain poor held-out generalization"}],"takeaway":"Separate training fit, held-out performance and post-deployment drift.","source":"nist"},{"id":"cef8a5ea47a3","domain":"ML foundations","level":"A","stem":"A transaction model's false negatives triple after a product launch, but AUC stays similar. What should you inspect first?","choices":[{"text":"Class balance, calibration and operating thresholds on new traffic","why":"Ranking can remain useful while thresholded decisions deteriorate"},{"text":"Increase the training-set epoch count immediately","why":"More fitting does not isolate changed prevalence or thresholds"},{"text":"Replace AUC with training accuracy only","why":"Training accuracy further hides the production issue"},{"text":"Assume the labelers were attacked because false negatives rose","why":"Attack attribution needs evidence beyond metric movement"}],"takeaway":"Disaggregate score distributions and error rates at the actual threshold.","source":"nist"},{"id":"55cac7334678","domain":"ML foundations","level":"A","stem":"A model is evaluated by randomly splitting user sessions into train/test; accuracy is unusually high. What is the most likely validity concern?","choices":[{"text":"Session-level user overlap and temporal leakage across folds","why":"Group/time leakage can inflate results"},{"text":"A random seed always makes performance non-reproducible","why":"Fixed seeds can aid reproducibility but do not fix leakage"},{"text":"Cross-validation automatically prevents distribution leakage","why":"It can preserve the same flawed split unit"},{"text":"Increase stratification of the same random session split","why":"Stratification preserves class ratios but does not fix within-user or temporal leakage"}],"takeaway":"Split on the prediction unit and realistic deployment time horizon.","source":"nist"},{"id":"911826b660b1","domain":"ML foundations","level":"D","stem":"You must detect rare malicious uploads where missing one is costly, while analyst review capacity is limited. What evaluation design is strongest?","choices":[{"text":"Compare precision and recall with miss cost and review capacity","why":"Optimizes the real detection-rework tradeoff"},{"text":"Maximize accuracy on a balanced synthetic test set","why":"Synthetic balance may not reflect production burden"},{"text":"Set the decision threshold at 0.5 for calibrated probabilities","why":"0.5 is not intrinsically optimal under asymmetric costs"},{"text":"Optimize recall to 100% irrespective of false positives","why":"Unlimited reviews violate the capacity constraint"}],"takeaway":"Include expected prevalence, review capacity and harm-weighted errors.","source":"nist"},{"id":"a7c7ad54f987","domain":"ML foundations","level":"D","stem":"A classifier will approve customer payments. Which model boundary most directly limits the impact of prediction mistakes?","choices":[{"text":"Enforce payment rules outside the model's own decisions","why":"A score informs decisions but cannot grant authority"},{"text":"A longer system prompt forbids incorrect approvals","why":"A classifier is not controlled by conversational instructions"},{"text":"A confidence score above 0.9 bypasses payment controls","why":"Confidence is not authorization or perfect calibration"},{"text":"The model is retrained nightly to prevent misuse","why":"Fresh weights do not impose payment constraints"}],"takeaway":"Keep decision support separate from irreversible authorization.","source":"nist"},{"id":"88303b9dec5f","domain":"ML foundations","level":"V","stem":"An executive asks for a single number proving an AI fraud model is safe. What is the strongest consulting response?","choices":[{"text":"A risk scorecard with false-negative costs and control thresholds","why":"Security assurance is multidimensional and context-specific"},{"text":"Report maximum validation accuracy and declare production readiness","why":"One aggregate metric omits operating conditions"},{"text":"Report cross-validation accuracy without distinguishing the operating threshold","why":"Cross-validation helps estimation but cannot summarize all workflow and harm measures"},{"text":"Replace operational metrics with a subjective maturity rating","why":"Ratings are weaker than measurable outcomes"}],"takeaway":"Define evidence of acceptable residual risk against the business workflow.","source":"nist"},{"id":"9405cc679f31","domain":"ML foundations","level":"V","stem":"A client wants to launch but the model has no labels for the newest region. What is the defensible gate?","choices":[{"text":"Restrict scope, validate a representative labeled sample and set monitoring plus rollback criteria","why":"Unknown distribution performance deserves explicit containment"},{"text":"Launch in the new region with stricter score thresholds and a weekly performance report","why":"Changing thresholds without regional labels does not establish sensitivity, calibration or the cost of failures."},{"text":"Use matched-region proxy labels and launch at full volume if aggregate precision remains stable","why":"Proxy labels and aggregate precision can hide region-specific false negatives and calibration drift."},{"text":"Deploy with manual review of flagged cases but no regional validation because reviewers catch errors","why":"Human review can mitigate consequence, but unflagged false negatives may never reach reviewers."}],"takeaway":"Ship a bounded pilot only with documented uncertainty and exit criteria.","source":"nist"},{"id":"ed1b95fb3a6f","domain":"LLM internals","level":"E","stem":"A model returns plausible but unsupported citations even at temperature zero. What is the best explanation?","choices":[{"text":"Deterministic token selection does not make generated claims grounded in sources","why":"Decoding temperature and factual verification are separate"},{"text":"The retrieval service probably returned snippets whose citation metadata was out of sync","why":"Metadata errors are possible, but citations can be fabricated without a retrieval metadata fault."},{"text":"The model is under-calibrated and therefore should use a lower decoding temperature","why":"Calibration and sampling can change variability but do not make citations reliably evidence-bound."},{"text":"The system supplied too few retrieved passages for the model to answer confidently","why":"Missing evidence increases risk, but plausible unsupported citations can arise even with ample context."}],"takeaway":"Distinguish next-token plausibility from evidence-backed accuracy.","source":"owasp"},{"id":"2bfc9b031f69","domain":"LLM internals","level":"E","stem":"An attacker inserts 'ignore prior instructions' into retrieved text. Why is it risky even if system instructions are higher priority?","choices":[{"text":"Lower-trust text can influence instruction-following behavior","why":"Instruction hierarchy reduces risk but is not a formal security reference monitor"},{"text":"Retrieved text automatically becomes a system message","why":"RAG does not ordinarily change role metadata"},{"text":"Embedding vectors have executable permissions","why":"Vectors are data and risk arises in their interpretation and use"},{"text":"The attention mechanism bypasses OAuth tokens directly","why":"The model's influence is indirect through app actions"}],"takeaway":"Text provenance and execution authorization must be enforced outside generation.","source":"owasp"},{"id":"f0564ef4eaf6","domain":"LLM internals","level":"A","stem":"A long-context assistant starts ignoring a critical policy midway through a 120k-token prompt. Which diagnostic best isolates the cause?","choices":[{"text":"Test recall and instruction adherence by policy position and distractor density","why":"Lost-in-the-middle and interference need position-controlled evaluation"},{"text":"Assume a context length advertised by the provider guarantees perfect recall","why":"Capacity does not imply uniform retrieval quality"},{"text":"Move all policy text to the end without testing precedence","why":"Position changes may help recall but do not guarantee instruction integrity"},{"text":"Check only API rate limits","why":"Rate limits do not measure within-context attention behavior"}],"takeaway":"Probe performance across positions, not simply maximum input size.","source":"owasp"},{"id":"f12344732b84","domain":"LLM internals","level":"A","stem":"A model occasionally exposes secrets from its prompt after many paraphrased probes. What is the more precise conclusion?","choices":[{"text":"Prompts can leak and are not secret stores","why":"Extraction risk survives wording-only defenses"},{"text":"All hidden instructions are always recoverable verbatim","why":"Likelihood and success depend on the model and controls"},{"text":"The model necessarily trained on those secrets","why":"Secrets may exist only in runtime context"},{"text":"Encrypted transport prevents the output disclosure","why":"TLS protects transit, not authorized model responses"}],"takeaway":"Keep credentials and authorization checks out of prompts.","source":"owasp"},{"id":"ecaf64a489fb","domain":"LLM internals","level":"D","stem":"An application needs deterministic financial calculations and natural-language narrative. Which composition is strongest?","choices":[{"text":"Trusted calculations with separately checked LLM explanations","why":"Computation and provenance should be controlled independently"},{"text":"Ask the LLM to calculate three times and take a majority vote","why":"Correlated generation errors can survive self-consistency"},{"text":"Request two independent model calculations and use the majority","why":"Agreement can mask correlated arithmetic mistakes and lacks authoritative calculation"},{"text":"Hide arithmetic formulas in a system prompt","why":"Prompt secrecy does not enforce correctness"}],"takeaway":"Use tools for verifiable operations and separate narrative from authority.","source":"owasp"},{"id":"96df92b46b61","domain":"LLM internals","level":"D","stem":"A chatbot must ingest a 500-page policy corpus with contradictory revisions. Which capability is most important beyond a bigger context window?","choices":[{"text":"Version-aware retrieval that resolves source conflicts","why":"More tokens cannot establish which policy governs"},{"text":"Use a single vector similarity threshold across all departments","why":"Similarity is not normative precedence"},{"text":"Fine-tune until the documents are memorized","why":"Weights obscure provenance and update timing"},{"text":"Choose the most recent document's title lexicographically","why":"Document order is not policy authority"}],"takeaway":"Capture source validity and precedence as structured data.","source":"owasp"},{"id":"e171f64847c7","domain":"LLM internals","level":"V","stem":"A stakeholder says a newer model's benchmark score means the assistant is secure. Which evidence closes the gap?","choices":[{"text":"Integrated-system testing of attacks and authorization","why":"Foundation benchmarks omit prompts, tools, data and permissions"},{"text":"A third-party leaderboard ranking alone","why":"Rankings measure different tasks from the workflow"},{"text":"A safety tuning report from the foundation-model provider","why":"Provider safety tuning is not proof of application-specific authorization and actions"},{"text":"A single no-jailbreak demonstration","why":"One demonstration cannot establish distributional resilience"}],"takeaway":"Evaluate the assembled system, not only the foundation model.","source":"owasp"},{"id":"fd983da89254","domain":"LLM internals","level":"V","stem":"An AI assistant upgrade changes tokenizer and context behavior. How should the rollout be managed?","choices":[{"text":"Pin the version, run a regression suite on safety and task cases, canary, and retain rollback","why":"Model changes can alter instruction handling and output contracts"},{"text":"Perform A/B testing for user satisfaction and replace the model if feedback worsens","why":"Satisfaction does not cover tokenizer-driven security regressions, policy failures or hidden tool-use changes."},{"text":"Verify the new tokenizer on a representative prompt corpus, then cut over all users simultaneously","why":"Tokenizer checks help, but they do not assess end-to-end safety behavior or provide safe rollback."},{"text":"Document the provider release notes and defer testing because the API contract remains compatible","why":"Interface compatibility is not behavioral equivalence, especially around long context and safety boundaries."}],"takeaway":"Treat model upgrades as material application releases.","source":"owasp"},{"id":"b1aad4e4cc4f","domain":"Training and adaptation","level":"E","stem":"A team proposes RAG to teach a model a proprietary writing style across most tasks. Which distinction matters?","choices":[{"text":"Fine-tuning alters model behavior, whereas RAG supplies external context at inference","why":"The objective is persistent behavior rather than current factual retrieval"},{"text":"RAG is generally preferable because retrieval quality can enforce a consistent output style","why":"Retrieved examples may influence a response but do not reliably alter a model's learned style across tasks."},{"text":"Fine-tuning is primarily useful for adding up-to-date proprietary facts, while RAG changes response behavior","why":"This reverses the usual distinction; retrieval injects current content while adaptation changes behavior."},{"text":"Both approaches are interchangeable if the same style examples are made available","why":"The mechanisms differ substantially in updateability, governance, latency and failure modes."}],"takeaway":"Choose adaptation based on behavior change versus information access.","source":"nist"},{"id":"b32979e7e4f2","domain":"Training and adaptation","level":"E","stem":"Why does training on records with PII create a risk that encryption-at-rest alone does not address?","choices":[{"text":"Training examples can leak through model behavior","why":"Storage encryption does not constrain learned representations"},{"text":"Encryption at rest prevents all model inversion attacks","why":"Inference can expose information despite disk controls"},{"text":"Training never changes a model's outputs based on individual records","why":"Learning can depend on individual examples"},{"text":"Synthetic labels remove all memorization risk","why":"Labels alone do not sanitize features"}],"takeaway":"Consider privacy attacks on the trained artifact itself.","source":"nist"},{"id":"7268e7a0fefd","domain":"Training and adaptation","level":"A","stem":"A fine-tuned model complies with an unusual attacker instruction only after a trigger phrase. What should you investigate?","choices":[{"text":"Look for poisoned data or a backdoor in the adapter","why":"Conditional behavior can be introduced through data or modified weights"},{"text":"An inference-time jailbreak that does not depend on adaptation","why":"Test whether the trigger also works with the base model before attributing it"},{"text":"A benign capability introduced by the adapter without checking for malicious triggers","why":"An adapter can intentionally encode backdoored conditional behavior"},{"text":"A normal retrieval ranking issue without checking training lineage","why":"The issue is observed in a tuned model independent of retrieval"}],"takeaway":"Test triggered and control prompts, then trace adaptation lineage.","source":"nist"},{"id":"b8c0055e2f52","domain":"Training and adaptation","level":"A","stem":"A LoRA adapter from a partner performs well on benchmarks but behaves strangely with internal phrases. Which risk is underappreciated?","choices":[{"text":"An adapter can hide a change in model behavior","why":"Small parameter deltas can still alter safety-critical outputs"},{"text":"LoRA cannot affect harmful behavior because it is low-rank","why":"Low rank is not a safety guarantee"},{"text":"A signed base-model hash verifies the adapter","why":"The adapter is a separate artifact"},{"text":"Read-only inference permissions prevent all model-level backdoors","why":"Outputs can still be manipulated"}],"takeaway":"Treat adapters as first-class model artifacts with provenance and test gates.","source":"nist"},{"id":"e59b55e692b4","domain":"Training and adaptation","level":"D","stem":"A regulated organization must adapt to private examples while limiting memorization. Which design most directly addresses privacy during learning?","choices":[{"text":"Limit private data and test the model's utility","why":"Access controls alone do not bound statistical memorization"},{"text":"Enable provider no-training mode only after fine-tuning","why":"Provider use settings do not sanitize an already trained artifact"},{"text":"Keep all raw examples for unlimited retraining","why":"Unbounded retention increases exposure"},{"text":"Use stronger prompt instructions to stop memorization","why":"Prompt directives cannot remove learned information"}],"takeaway":"Make privacy an objective of the training process and evaluation.","source":"nist"},{"id":"3112bc6a8272","domain":"Training and adaptation","level":"D","stem":"A client needs daily policy updates but rarely changes response style. What architecture is easiest to keep current and auditable?","choices":[{"text":"Use RAG with access checks on each policy version","why":"Knowledge freshness and attribution favor retrieval"},{"text":"Full fine-tuning of the foundation model each morning","why":"Expensive and difficult to audit for daily facts"},{"text":"Prompt-only copies of every policy in a giant system message","why":"Scaling and precedence become fragile"},{"text":"Unmoderated web search whenever policy is missing","why":"Untrusted external data is not an authoritative policy source"}],"takeaway":"Separate stable model behavior from changing enterprise knowledge.","source":"nist"},{"id":"5b79dbcb3846","domain":"Training and adaptation","level":"V","stem":"A team wants to accept a fine-tuned model on accuracy alone. What must the acceptance evidence include?","choices":[{"text":"Data rights, provenance and security tests","why":"Accuracy does not reveal backdoors or provenance"},{"text":"A screenshot of the training job's final loss","why":"It omits artifact and security assurance"},{"text":"A supplier email promising the data was clean","why":"Assurance needs inspectable records"},{"text":"A demo on the tuning examples","why":"It overstates generalization and misses attacks"}],"takeaway":"Define artifact acceptance criteria before tuning begins.","source":"nist"},{"id":"2f750e45e1fc","domain":"Training and adaptation","level":"V","stem":"After a provider re-trains its hosted model, old security test results become stale. What should the client require?","choices":[{"text":"Require notice of changes, model version IDs and retesting","why":"A managed service still changes the system's risk profile"},{"text":"Accept vendor benchmark comparisons as long as the published aggregate safety score improves","why":"General benchmarks may not exercise the client's actual data, tools or failure consequences."},{"text":"Require quarterly attestation and conduct full retesting only when users report problems","why":"Reactive testing leaves changed model behavior in production before controls have been reassessed."},{"text":"Freeze client prompts and retrieval settings to offset model changes","why":"A stable application configuration does not constrain the provider's changed model behavior."}],"takeaway":"Contract for lifecycle evidence and control over material changes.","source":"nist"},{"id":"d4157b41ffa8","domain":"Application architecture","level":"E","stem":"A chatbot reads support tickets and can also modify refunds. Which distinction drives the largest architecture risk?","choices":[{"text":"Read-only assistance versus side-effecting tools creates different authority and blast radius","why":"Transactions require independent authorization and constraints"},{"text":"The main difference is response accuracy, because incorrect summaries cause the same loss as incorrect refunds","why":"Side-effecting tools can create direct financial or authorization consequences absent in a read-only summary."},{"text":"Refund modifications are safe when the assistant is hosted on a private model endpoint","why":"Network isolation does not determine which actions the application identity can execute."},{"text":"The same model can serve both cases if refund actions are logged comprehensively","why":"Logs support detection and reconstruction but are not a preventive boundary on authorized actions."}],"takeaway":"Classify AI components by data access and actions they can perform.","source":"owasp"},{"id":"25ad6b1219f8","domain":"Application architecture","level":"E","stem":"Why are prompt templates insufficient as the only security control for an enterprise assistant?","choices":[{"text":"They influence a probabilistic model but do not mediate access to systems","why":"Authentication and business-policy enforcement must be deterministic"},{"text":"Prompts cannot provide any useful safety guidance","why":"They help behavior but are not an authority boundary"},{"text":"Every output token is necessarily malicious","why":"Most outputs may be legitimate"},{"text":"An API gateway authenticates users but relies on the model to decide resource permissions","why":"Authentication alone does not validate each requested action"}],"takeaway":"Place security invariants in code and platform controls.","source":"owasp"},{"id":"762bdd94f805","domain":"Application architecture","level":"A","stem":"A summarization assistant can access other customers' records only when a user types a document ID. What's the likely defect?","choices":[{"text":"Cross-tenant access through unchecked document IDs","why":"Object access checks must use verified caller identity"},{"text":"A prompt-template failure causing an incorrect summary","why":"Prompt quality cannot account for a backend returning another tenant's record"},{"text":"The output redaction policy is missing","why":"Output DLP may help but cannot substitute for document authorization"},{"text":"The user interface has not hidden the ID field","why":"Hiding IDs does not enforce isolation"}],"takeaway":"Test the service boundary using adversarial IDs with real session identities.","source":"owasp"},{"id":"b10534a85273","domain":"Application architecture","level":"A","stem":"A vendor claims a chatbot is 'inside the VPC,' but documents traverse a managed model endpoint. What should you ask first?","choices":[{"text":"Trace plaintext, logs, subcontractors and governing policies","why":"Network placement alone does not prove end-to-end residency"},{"text":"Whether the VPC CIDR is large enough","why":"Address capacity is not the trust question"},{"text":"Whether only a private endpoint was configured for the app frontend","why":"Frontend privacy does not establish all downstream service and logging paths"},{"text":"Whether the model has the highest benchmark score","why":"Capability scores do not reveal processing boundaries"}],"takeaway":"Draw the actual data flows, not only network boxes.","source":"owasp"},{"id":"2b5f8d76ea08","domain":"Application architecture","level":"D","stem":"You need a multi-tenant RAG app with sensitive records. Which control should be the primary access boundary?","choices":[{"text":"Check who may see each document before retrieval","why":"Models must not decide whether the caller can see a record"},{"text":"Tell the model never to quote another tenant","why":"A prompt cannot reliably enforce isolation"},{"text":"Filter generated answers by a generic PII detector","why":"Cross-tenant trade secrets may not be PII"},{"text":"Create one shared index with hidden tenant names","why":"Obscurity is not authorization"}],"takeaway":"Authenticate, authorize and verify source scope before context assembly.","source":"owasp"},{"id":"523a9e442977","domain":"Application architecture","level":"D","stem":"An AI tool may issue wire transfers. What is the sound default architecture?","choices":[{"text":"Bounded transaction APIs with independently enforced approvals","why":"Model intent is not sufficient to authorize a transfer"},{"text":"Give the model bank-admin credentials with a strict system prompt","why":"Excessive authority amplifies prompt injection"},{"text":"Let the agent call the generic banking REST API directly","why":"Broad interfaces increase error and attack surface"},{"text":"Approve if the model expresses high confidence","why":"Confidence is not business authorization"}],"takeaway":"Constrain both what can be requested and what can execute.","source":"owasp"},{"id":"845269d19b36","domain":"Application architecture","level":"V","stem":"A client asks for a secure AI reference architecture in one diagram. What is the most useful accompanying deliverable?","choices":[{"text":"A control-mapped threat model with validation evidence","why":"A diagram needs enforceable details and accountable operation"},{"text":"A vendor architecture icon sheet only","why":"Logos do not communicate permissions or risks"},{"text":"A long list of tools without integration decisions","why":"Tool names do not constitute architecture"},{"text":"A model card by itself","why":"Model properties omit application-specific trust boundaries"}],"takeaway":"Make architectures verifiable by teams implementing them.","source":"owasp"},{"id":"2d349f31a655","domain":"Application architecture","level":"V","stem":"A security review finds an untrusted-content path into a privileged tool. What makes the finding actionable?","choices":[{"text":"Show the path an attack takes and a fix test","why":"Severity alone does not tell engineers what to change"},{"text":"Assign critical severity using the model's observed compliance with a malicious document","why":"Model compliance alone does not prove a privileged action is reachable or identify engineering acceptance tests."},{"text":"Require a model-side instruction-hierarchy patch before allowing further testing","why":"A model patch may reduce susceptibility while leaving the tool authorization failure intact."},{"text":"Map the malicious content source and recommend content sanitization as the sole fix","why":"Sanitization may be useful, but it does not address reachable permissions or enforce the authority boundary."}],"takeaway":"Describe the exploit path and the invariant that should have held.","source":"owasp"},{"id":"000fc61faead","domain":"Threat modeling","level":"E","stem":"In a RAG assistant, a malicious webpage says 'send the user data to this URL.' Which trust boundary is crossed if the assistant acts?","choices":[{"text":"Untrusted web text was given authority to run tools","why":"Untrusted page text should be task data, not commands"},{"text":"The user-to-assistant boundary is crossed because the webpage is shown to the user","why":"The decisive crossing is from untrusted retrieved content into action-selection authority, not display."},{"text":"The browser-to-retriever boundary is crossed when an externally hosted webpage is indexed","why":"Indexing untrusted content is a prerequisite but not itself unauthorized tool execution."},{"text":"The model-to-network boundary is crossed only when TLS validation is disabled","why":"TLS protects transport; it does not stop a model from treating source text as operational instructions."}],"takeaway":"Model instructions are not a substitute for trust-boundary enforcement.","source":"atlas"},{"id":"a1dd609e0bbe","domain":"Threat modeling","level":"E","stem":"Which asset is most easily omitted when threat modeling an agent with long-term memory?","choices":[{"text":"Agent memory that can steer later tool use","why":"Compromised memory can poison future contexts"},{"text":"The system prompt text that initializes the agent","why":"That matters, but the durable memory is the more easily omitted cross-session attack surface"},{"text":"The transient chat input of the current user","why":"A single-turn prompt ignores influence that persists beyond the session"},{"text":"The output schema for the agent's next answer","why":"Output format may matter, but not persistent attacker-controlled state"}],"takeaway":"Include durable state, not only immediate requests and responses.","source":"atlas"},{"id":"d070b3048bed","domain":"Threat modeling","level":"A","stem":"An agent is allowed to update CRM records. A poisoned email triggers an unauthorized update. What should the threat model connect?","choices":[{"text":"Email ingestion to instruction interpretation to CRM tool authorization","why":"The critical path spans data and action systems"},{"text":"Only the email sender's IP reputation","why":"Reputation alone does not explain the action"},{"text":"Only the CRM database encryption algorithm","why":"Encryption does not guard permitted malicious writes"},{"text":"Only the original email content, without mapping action permissions","why":"Entry content is not enough to explain an actual CRM write"}],"takeaway":"Model the complete privilege path from entry to consequence.","source":"atlas"},{"id":"65604007b767","domain":"Threat modeling","level":"A","stem":"A model endpoint blocks harmful text but its image captioner reads hidden image instructions. Which threat-model gap exists?","choices":[{"text":"An unmodeled modality-to-text trust boundary","why":"Instructions can enter through OCR/captions as well as plain text"},{"text":"Failure to use only deterministic decoding","why":"Decoding does not sanitize image content"},{"text":"Lack of multi-region failover","why":"Availability does not explain injection"},{"text":"An inadequate text content filter at the final response stage","why":"The dangerous instruction may reach tools before output filtering"}],"takeaway":"Enumerate all ingestion channels and modality conversions.","source":"atlas"},{"id":"a8eb2e074e97","domain":"Threat modeling","level":"D","stem":"A threat model for a coding agent has 40 possible threats. How should controls be prioritized?","choices":[{"text":"Rank paths by reach, risk and impact","why":"Threat volume alone does not measure exposure"},{"text":"Equal effort across all listed threats","why":"Risk and exploitability differ"},{"text":"Only by the earliest attack-chain step","why":"Later privilege steps may offer better chokepoints"},{"text":"By whichever controls are easiest to buy","why":"Ease is not the only decision criterion"}],"takeaway":"Map paths to consequences and prioritize defensible choke points.","source":"atlas"},{"id":"fbd61aee6504","domain":"Threat modeling","level":"D","stem":"Which artifact best supports continuous threat modeling as an agent gains new tools?","choices":[{"text":"Versioned permissions and trust-boundary tests","why":"New tools change reachability and blast radius"},{"text":"A one-time list of the model's favorite answers","why":"It does not capture system authority"},{"text":"A static training syllabus","why":"Education is not an architecture state record"},{"text":"An annual policy attestation only","why":"Attestation misses changes between reviews"}],"takeaway":"Treat capability additions as model and trust-boundary changes.","source":"atlas"},{"id":"e516d398c0d6","domain":"Threat modeling","level":"V","stem":"A business owner says 'the model only suggests actions.' How do you verify the claim?","choices":[{"text":"Trace downstream actions and integrations","why":"App wiring, not marketing, determines autonomy"},{"text":"Trust the feature name 'copilot'","why":"Names do not establish side effects"},{"text":"Check only the foundation model API terms","why":"They do not show downstream workflows"},{"text":"Ask for the number of prompts per day","why":"Volume is not proof of read-only behavior"}],"takeaway":"Validate effective authority from end to end.","source":"atlas"},{"id":"678b9c3cacb2","domain":"Threat modeling","level":"V","stem":"A client asks if a system is vulnerable to prompt injection. What answer is most actionable?","choices":[{"text":"Show who can inject what, into which tool, with what effect","why":"Risk needs a defined scenario and impact"},{"text":"Provide a susceptibility score based on prompt injection success against the base model","why":"Base-model behavior alone omits tool authority and end-to-end business impact."},{"text":"Recommend stronger system prompts and retest whether the model repeats the injected phrase","why":"Phrase repetition is a weak surrogate for a consequential unauthorized action."},{"text":"Report the attacker's ability to alter retrieved content without exercising tool calls","why":"Attacker control is necessary context but not enough to establish exploitable impact."}],"takeaway":"Threat models should produce specific adversarial test cases.","source":"atlas"},{"id":"892c6f3d8240","domain":"Adversarial ML","level":"E","stem":"A tiny pattern added to input images causes a classifier to mislabel them at inference. Which attack class fits best?","choices":[{"text":"An evasion attack using crafted inputs at inference time","why":"The attacker manipulates inference inputs rather than training labels"},{"text":"Training-data poisoning that implants a persistent malicious visual feature","why":"The pattern is added at inference, not shown to have modified the training set."},{"text":"A backdoor trigger activated by an untrusted model checkpoint","why":"A backdoor requires evidence of a deliberately trained trigger-response relationship."},{"text":"A data-distribution shift from environmental changes in camera capture","why":"Ordinary shifts can reduce accuracy, but an attacker-crafted perturbation is characteristic of evasion."}],"takeaway":"Locate the attack in the model lifecycle before choosing mitigations.","source":"nist"},{"id":"2c5048fe695a","domain":"Adversarial ML","level":"E","stem":"An attacker probes a prediction API to infer whether a specific person's record was in training. What risk is being tested?","choices":[{"text":"Membership inference","why":"The attack tries to reveal training-set participation"},{"text":"Prompt injection","why":"The objective is not control of instructions"},{"text":"Feature-store data corruption","why":"The model inputs or training tables need not be modified"},{"text":"Gradient accumulation failure","why":"No training optimization issue is implied"}],"takeaway":"Prediction APIs can leak information about their training populations.","source":"nist"},{"id":"e84a11e11e14","domain":"Adversarial ML","level":"A","stem":"A spam filter fails on messages with odd Unicode substitutions. What is the first robustness check?","choices":[{"text":"Adversarial Unicode robustness testing","why":"Character tricks can exploit feature sensitivity"},{"text":"Retrain on only the clean test set","why":"That can overfit and contaminate evaluation"},{"text":"Disable Unicode support globally","why":"It would break legitimate content and not address broader evasion"},{"text":"Adjust the spam-score threshold using only clean validation examples","why":"Threshold tuning may not address targeted transformed inputs"}],"takeaway":"Compare transformation families and hold out unseen variants.","source":"nist"},{"id":"a0eae65127eb","domain":"Adversarial ML","level":"A","stem":"A vendor says adversarial training eliminates all evasion risk. Which concern remains?","choices":[{"text":"Robustness remains conditional on attacker capabilities and budgets","why":"Training against some attacks does not prove universal robustness"},{"text":"Adversarial training is categorically impossible for neural nets","why":"It is a legitimate method under constraints"},{"text":"Evasion only exists for image inputs","why":"Text and other modalities also have evasion"},{"text":"Red teaming becomes unnecessary after fine-tuning","why":"Adaptive attacks can find new weaknesses"}],"takeaway":"State the attacker capability against which robustness was demonstrated.","source":"nist"},{"id":"7e4ac2dc2cf4","domain":"Adversarial ML","level":"D","stem":"You must protect a malware classifier against query-based model extraction. Which combined design is strongest?","choices":[{"text":"Query controls, score minimization and extraction monitoring","why":"Extraction exploits repeated informative access"},{"text":"Publish full probability vectors to every caller for transparency","why":"Rich signals can increase extraction efficiency"},{"text":"Rely on secret endpoint names only","why":"Discoverability controls are weak"},{"text":"Turn off logging to make queries cheaper","why":"Monitoring supports detection and response"}],"takeaway":"Balance legitimate API use with abuse detection and output minimization.","source":"nist"},{"id":"898e715c5c25","domain":"Adversarial ML","level":"D","stem":"A CV system must tolerate camera changes and malicious stickers. What test strategy is strongest?","choices":[{"text":"Test drift and adversarial perturbations","why":"Different stressors require distinct evidence"},{"text":"Use only untouched lab images","why":"They miss both challenges"},{"text":"Treat data augmentation as a proof of security","why":"Augmentation improves coverage but is not proof"},{"text":"Measure training loss after every deployment","why":"Training loss does not characterize real-world robustness"}],"takeaway":"A realistic attack model includes physical constraints and drift.","source":"nist"},{"id":"c29e67bf1782","domain":"Adversarial ML","level":"V","stem":"A poisoned dataset is discovered after a model was released. What is the first deliverable?","choices":[{"text":"Trace which models used the bad data","why":"You need to know which artifacts inherited the data"},{"text":"An organization-wide ban on new GPUs","why":"Compute selection does not remove poisoned weights"},{"text":"A prompt patch saying 'ignore poisoned data'","why":"The influence may be embedded in parameters"},{"text":"An assurance statement without tracing copies","why":"Scope must be established before declaring containment"}],"takeaway":"Model and dataset provenance make incident scoping possible.","source":"nist"},{"id":"d86d187fd588","domain":"Adversarial ML","level":"V","stem":"A client wants a red-team report that lists 100 successful attacks. What extra evidence makes it decision-grade?","choices":[{"text":"Success rates by attacker capability, baseline, severity and reproducible exploit chains","why":"Raw counts overstate coverage and omit exposure"},{"text":"Rank the top ten attack prompts by severity and include screenshots of each failure","why":"A ranked sample lacks denominators, reproducibility and scope of attacker access."},{"text":"Report attack counts by model provider and give each finding a CVSS score","why":"Provider counts and scores do not establish success rate or real business consequences."},{"text":"Describe every successful prompt plus the model response while excluding blocked attempts","why":"Without attempts and baselines, leaders cannot infer likelihood, comparative performance or coverage."}],"takeaway":"Normalize findings by threat assumptions and attack opportunity.","source":"nist"},{"id":"90acca2e6a64","domain":"LLM attack surfaces","level":"E","stem":"A retrieved document says 'SYSTEM: ignore previous instructions.' What is the primary issue?","choices":[{"text":"A lower-trust source is used as higher-trust instructions","why":"Role-like tokens in content do not grant system-level authority"},{"text":"Retrieval poisoning that only biases answer selection without changing instruction behavior","why":"Poisoned retrieval is relevant, but the direct failure is authority confusion when a document poses as system instructions."},{"text":"A system-prompt disclosure vulnerability caused by publishing the model's configuration","why":"The document is asserting an instruction; disclosure of a genuine system prompt has not been shown."},{"text":"A metadata integrity error that makes a retrieved document appear fresher than it is","why":"Metadata could affect trust, but forged role language is the relevant mechanism in this example."}],"takeaway":"Separate untrusted source content from app instructions and actions.","source":"owasp"},{"id":"545bda2773eb","domain":"LLM attack surfaces","level":"E","stem":"A malicious user asks the assistant to print its hidden prompt, and it complies. Which control was fundamentally missing?","choices":[{"text":"Confidentiality controls cannot depend on hidden prompts","why":"Prompt non-disclosure is not robust secret management"},{"text":"The prompt should have placed the hidden instructions last","why":"Position might alter behavior but cannot make prompt content a secret boundary"},{"text":"HTTPS needed to be enabled on the chat page","why":"TLS cannot stop an authorized response from exposing data"},{"text":"Increasing token limits would prevent the response","why":"More context does not establish confidentiality"}],"takeaway":"System prompts should never contain credentials or sole enforcement logic.","source":"owasp"},{"id":"38903b15070f","domain":"LLM attack surfaces","level":"A","stem":"A tool-using assistant follows a link inside a customer complaint and then posts customer data to a new domain. What failure should be confirmed?","choices":[{"text":"Tool egress was not checked after untrusted content was read","why":"The attacker crossed content-to-action authority"},{"text":"The model should have ignored web citations without constraining network destinations","why":"Citations affect explanation but do not enforce where tools can send data"},{"text":"The user was logged out of the web app","why":"This would normally restrict access, not authorize transfer"},{"text":"The browser tool implicitly trusted links from the external page","why":"Following a link can contribute, but egress authorization is still the missing preventive boundary"}],"takeaway":"Inspect tool-call arguments, policy decisions and source provenance.","source":"owasp"},{"id":"45662adaa937","domain":"LLM attack surfaces","level":"A","stem":"A defender ignores a malicious sentence visible in a PDF, yet obeys identical words hidden in document metadata. What does that show?","choices":[{"text":"Text in PDF metadata can inject instructions","why":"Metadata may enter model context without user awareness"},{"text":"Metadata is always higher priority than the system prompt","why":"Priority is not inherently assigned by metadata"},{"text":"The PDF is a training-time poison by definition","why":"The attack can be entirely inference-time"},{"text":"PDF signatures guarantee a document is benign","why":"Authenticity does not imply safe instructions"}],"takeaway":"Test every extraction channel, not only what a human sees.","source":"owasp"},{"id":"b2345d198d9e","domain":"LLM attack surfaces","level":"D","stem":"A helpdesk agent must browse public support content while resetting passwords for users. What is the safest control choice?","choices":[{"text":"Use an ID check and a separate narrow reset tool","why":"Browsing content must never supply authority to reset accounts"},{"text":"Put reset rules inside a long hidden system prompt","why":"Prompts cannot validate account ownership"},{"text":"Give the browse tool and reset tool the same unrestricted credentials","why":"This expands attack paths"},{"text":"Trust public pages from the company's domain without inspection","why":"Even trusted domains can host mutable or compromised content"}],"takeaway":"Segregate untrusted reading from privileged execution.","source":"owasp"},{"id":"190a2ab979f0","domain":"LLM attack surfaces","level":"D","stem":"A retrieved snippet includes a malicious URL and the model recommends fetching it. What must the fetch layer enforce?","choices":[{"text":"Egress policy with DNS and redirect-aware SSRF defenses","why":"The model cannot guarantee safe destinations"},{"text":"Checking only the URL string for 'localhost'","why":"DNS and redirects can bypass textual checks"},{"text":"Instructing the assistant not to browse internal addresses","why":"A probabilistic instruction is not network policy"},{"text":"A user warning after the fetch has completed","why":"Exfiltration may already have occurred"}],"takeaway":"Validate destinations at the network/action layer.","source":"owasp"},{"id":"69445ac5f0e5","domain":"LLM attack surfaces","level":"V","stem":"Your client reports a 0% jailbreak rate on ten internal tests. What caveat is most important?","choices":[{"text":"Ten probes cannot establish broad attack resistance","why":"Threat diversity and statistical confidence are limited"},{"text":"All jailbreaks are necessarily harmless","why":"Some lead to actual system actions"},{"text":"Ten tests prove the model is formally verified","why":"Empirical tests are not a proof of absence"},{"text":"Any failed injection means the solution must be abandoned","why":"Risk can be managed with layered controls"}],"takeaway":"Report test coverage, severity and system consequences, not just a pass rate.","source":"owasp"},{"id":"f890244efff4","domain":"LLM attack surfaces","level":"V","stem":"A team proposes patching every successful prompt injection with an extra forbidden phrase. How should you redirect?","choices":[{"text":"Check who may use each tool before trying prompt fixes","why":"Patch-by-phrase defenses are brittle against paraphrases"},{"text":"Add centralized input sanitization for every retrieved text field before any model exposure","why":"Sanitization can help, but it is fragile against paraphrases and cannot replace tool authorization."},{"text":"Move forbidden phrases into higher-priority system instructions and monitor refusals","why":"Priority helps instruction following but provides no hard boundary against unauthorized tool effects."},{"text":"Deploy a classifier that blocks suspicious prompts before the model sees them","why":"A detector can reduce exposure but does not eliminate false negatives or constrain tool execution."}],"takeaway":"Fix invariant boundaries instead of chasing attack strings.","source":"owasp"},{"id":"44e5c83b2853","domain":"Multimodal security","level":"E","stem":"A vision-language assistant converts an uploaded screenshot into text and obeys text embedded in the image. What is the key threat?","choices":[{"text":"Image text is an untrusted input, not a command","why":"OCR can launder attacker-controlled pixels into instruction-like context"},{"text":"The OCR subsystem accepts unsupported characters and may corrupt the document","why":"OCR accuracy is relevant, but the prompt-injection risk comes from treating visual content as instructions."},{"text":"The screenshot's source cannot be authenticated with a digital signature","why":"Authenticity may matter, but even authentic screenshots are lower-trust data, not tool instructions."},{"text":"The application has insufficient image classification safeguards against disallowed content","why":"Content moderation is different from authority separation across the vision-to-instruction path."}],"takeaway":"Image, audio and video all need input provenance and instruction boundaries.","source":"owasp"},{"id":"cdb966847ebc","domain":"Multimodal security","level":"E","stem":"Why does deleting visible text from a scanned document not necessarily remove an injection payload?","choices":[{"text":"Invisible OCR layers or metadata may retain instructions","why":"What a user sees and what a parser passes to a model can differ"},{"text":"An image always has only one text representation","why":"Containers and processing pipelines can expose several"},{"text":"Every PDF is executable software","why":"The risk here can come from plain data content"},{"text":"TLS reintroduces deleted text into files","why":"Transport does not restore content"}],"takeaway":"Inspect the actual model-visible representation, not only previews.","source":"owasp"},{"id":"aca0384fd886","domain":"Multimodal security","level":"A","stem":"A voice assistant initiates a payment after background speech from a television. Which hypothesis should be tested first?","choices":[{"text":"The system treated TV audio as a valid payment order","why":"Voice transcription does not prove user intent or authority"},{"text":"The speech recognizer's word-error rate is necessarily zero","why":"Recognition accuracy is not authorization"},{"text":"The television was connected to the payment API","why":"Acoustic input alone may be sufficient"},{"text":"An LLM training example had to contain the exact phrase","why":"Runtime input can trigger the behavior"}],"takeaway":"Separate speaker identification, user confirmation and payment authority.","source":"owasp"},{"id":"12948dae7dff","domain":"Multimodal security","level":"A","stem":"A document-processing system passes image OCR into the same role as developer instructions. What is the severity driver?","choices":[{"text":"OCR text was made into trusted input","why":"A role boundary can make injection more effective"},{"text":"The average image resolution is too high","why":"Resolution affects extraction quality, not role trust by itself"},{"text":"The OCR engine is open source","why":"Licensing does not establish attack reachability"},{"text":"The documents are stored in object storage","why":"Storage location is not the issue"}],"takeaway":"Trace how modality outputs are labeled before the model receives them.","source":"owasp"},{"id":"b6af7b7d07f6","domain":"Multimodal security","level":"D","stem":"A medical transcription assistant may hear unrelated people and must write clinical notes. Which architecture best limits privacy harm?","choices":[{"text":"Consent, minimized capture and review before chart writes","why":"Mixed audio and side effects need independent controls"},{"text":"Record continuously and delete data only after a complaint","why":"This maximizes collection and exposure"},{"text":"Let the model decide whose voice counts as consent","why":"A probabilistic judgment is weak legal/operational authority"},{"text":"Turn transcription temperature to zero and skip review","why":"Deterministic text can still be inaccurate or unauthorized"}],"takeaway":"Capture governance and chart-write authority must be separate.","source":"owasp"},{"id":"fd723f43a8ed","domain":"Multimodal security","level":"D","stem":"A multimodal assistant will read diagrams that contain network addresses. What defense most directly prevents the image from initiating network actions?","choices":[{"text":"Approve tool actions outside the vision model","why":"Visual content must not become tool permission"},{"text":"Blur every diagram before the model sees it","why":"That may destroy legitimate utility and misses embedded text elsewhere"},{"text":"Replace OCR with higher-resolution OCR","why":"Better extraction can amplify an injection"},{"text":"Whitelist only PNG files","why":"File format does not establish intent or trust"}],"takeaway":"Limit what extracted information can cause, not only how it is read.","source":"owasp"},{"id":"85759c17a3ba","domain":"Multimodal security","level":"V","stem":"A supplier claims a content filter protects text, images and audio. What evidence should you request?","choices":[{"text":"Cross-modal adversarial tests measuring real tool effects","why":"One text benchmark says little about image or audio pathways"},{"text":"A single statement that the API supports multimodal inputs","why":"Capability is not control effectiveness"},{"text":"Text-only filter validation with high recall","why":"A text test set does not establish multimodal attack coverage"},{"text":"Only the filter's false-positive rate on text","why":"It omits missed attacks and other modalities"}],"takeaway":"Evaluate each modality and the transition between modalities.","source":"owasp"},{"id":"4375219983e5","domain":"Multimodal security","level":"V","stem":"An image safety review passed, but the deployed workflow begins extracting image captions into tool prompts. What is the release decision?","choices":[{"text":"Reopen the threat model and test the new caption-to-tool path before rollout","why":"A new derived text path changes authority reachability"},{"text":"Approve the release with a condition to audit captions during the first 30 days","why":"Post-launch observation does not substitute for pre-release validation of a new action path."},{"text":"Reuse image-only evaluation but add more prompt-injection examples to its dataset","why":"The changed trust boundary is caption text to tools, which must be exercised end-to-end."},{"text":"Disable OCR while retaining caption generation, then classify the path as image-only","why":"Captions still carry attacker-origin content into downstream tool prompts."}],"takeaway":"Revalidate whenever a new modality conversion gains influence.","source":"owasp"},{"id":"23a2a91c02c4","domain":"RAG and retrieval security","level":"E","stem":"A document is indexed for semantic search after its owner's access is revoked. What property must retrieval preserve?","choices":[{"text":"Use the user's current rights to each source document","why":"An embedding index is not an authorization exception"},{"text":"Preserve the ACL snapshot that was in force when the file was originally indexed","why":"A historical ACL can authorize content the user can no longer access."},{"text":"Require a document classification label to be attached to every embedding","why":"Classification guides handling, but does not enforce current object-level permissions."},{"text":"Filter answers containing revoked document titles after the model generates them","why":"Post-generation filtering cannot undo disclosure of sensitive content in the model context."}],"takeaway":"Retrieval must enforce current source permissions, not static index membership.","source":"owasp"},{"id":"966b6f56d881","domain":"RAG and retrieval security","level":"E","stem":"Why does HNSW vector search not inherently preserve document permissions?","choices":[{"text":"Vector-neighbor ranking does not enforce document entitlements","why":"Authorization is an external constraint unless engineered into retrieval"},{"text":"HNSW always exports the entire index","why":"ANN traversal is not necessarily data export"},{"text":"HNSW can't return any exact neighbor","why":"It can return accurate results, just approximately"},{"text":"Encryption makes graph nodes automatically tenant-scoped","why":"Encryption does not provide query-time authorization"}],"takeaway":"Filter eligible candidates before exposure and re-check returned sources.","source":"owasp"},{"id":"1bce643e4426","domain":"RAG and retrieval security","level":"A","stem":"A RAG app filters disallowed documents after ANN search and frequently returns empty results for restricted users. Why?","choices":[{"text":"Top-k consumed by unauthorized search hits","why":"Post-filtering can hurt recall for authorized content"},{"text":"Authorized records are mathematically impossible to embed","why":"Embedding is independent of ACL"},{"text":"Expand the embedding dimension to boost semantic recall","why":"Ranking capacity alone cannot restore authorized hits discarded post-search"},{"text":"HNSW always ignores metadata filters deliberately","why":"Behavior depends on implementation and query plan"}],"takeaway":"Compare pre-filter, hybrid filtering and overfetch strategies for recall and security.","source":"owasp"},{"id":"962f46e64f98","domain":"RAG and retrieval security","level":"A","stem":"A user can infer a confidential product codename from search suggestions without receiving any document body. What's the overlooked leak?","choices":[{"text":"Search metadata can expose restricted corpus information","why":"Authorization must cover search side channels"},{"text":"Only full document text can be sensitive","why":"Derived signals can expose facts"},{"text":"Removing citations necessarily fixes the leak","why":"Suggestion and score leakage remain"},{"text":"The result-count response can be returned without document authorization","why":"Counts can leak existence even when body access is withheld"}],"takeaway":"Test unauthorized queries for existence and ranking leakage.","source":"owasp"},{"id":"dd0e6573bff2","domain":"RAG and retrieval security","level":"D","stem":"A RAG index merges HR and finance content with distinct rules. Which design best balances recall and isolation?","choices":[{"text":"Search within allowed sources, then check access on use","why":"Both relevance and entitlement should be explicit"},{"text":"Trust the LLM to discard unauthorized excerpts after seeing them","why":"Exposure has already happened"},{"text":"Rely only on a shared vector-space distance cutoff","why":"Semantic distance does not encode permissions"},{"text":"Apply a single per-user filter only during final answer generation","why":"The model can still see information it should not have received"}],"takeaway":"Treat authorization and relevance as separate retrieval predicates.","source":"owasp"},{"id":"14b1db8f7615","domain":"RAG and retrieval security","level":"D","stem":"A prompt injection in a retrieved FAQ tells the assistant to ignore refund limits. What architecture blocks a real refund exploit?","choices":[{"text":"Refund APIs independently enforce identity and transaction limits","why":"Documents can influence text but cannot override transaction policy"},{"text":"Strip the phrase 'ignore previous instructions' from every snippet","why":"Attackers can paraphrase and use indirect tactics"},{"text":"Increase retrieval top-k to include more benign documents","why":"Dilution is not a reliable boundary"},{"text":"Use a larger embedding model","why":"Relevance improvements do not enforce refunds"}],"takeaway":"A RAG assistant should never be the ultimate policy enforcement point.","source":"owasp"},{"id":"010d599c4028","domain":"RAG and retrieval security","level":"V","stem":"The client wants proof that RAG permissions work. What test matrix is strongest?","choices":[{"text":"Cross-tenant tests, revoked ACLs and retrieval edge cases","why":"Correctness must survive lifecycle changes and retrieval edge cases"},{"text":"One admin account querying a public document","why":"This misses denial boundaries"},{"text":"A similarity benchmark with no identities","why":"Relevance metrics omit authorization"},{"text":"A model refusal demo without inspecting retrieved context","why":"The model may see data even if it refuses"}],"takeaway":"Test both authorization and retrieval behavior under changes.","source":"owasp"},{"id":"eeda1be024e4","domain":"RAG and retrieval security","level":"V","stem":"An index refresh lags source ACL changes by six hours. What should the go-live decision depend on?","choices":[{"text":"Verify live source rights and if the sync lag is safe","why":"Freshness alone is tolerable only if enforcement remains correct"},{"text":"Accept six hours of stale permissions if index encryption and document labels are enabled","why":"Encryption and classification do not enforce current requester entitlements."},{"text":"Use the index's ACL snapshots and apply a final PII detector before answering","why":"Stale ACLs can expose non-PII restricted data or leak information before post-generation filtering."},{"text":"Force daily reindexing and rely on security monitoring for revocations between runs","why":"Daily indexing is slower than the known six-hour lag, and monitoring is not preventive authorization."}],"takeaway":"Know which system is authoritative at query and context-assembly time.","source":"owasp"},{"id":"d92a03899d71","domain":"Identity and authorization","level":"E","stem":"An AI agent calls a CRM on behalf of a user. Which identity question is essential?","choices":[{"text":"Whether the action is bound to the user, a workload identity, or a delegated combination","why":"The principal determines enforceable permissions and audit attribution"},{"text":"Whether the CRM access token is stored in a secure vault and rotated on schedule","why":"Credential hygiene matters but does not establish whose authority a specific action represents."},{"text":"Whether the model runs under an approved service principal in the enterprise directory","why":"A known workload identity does not prove whether the user delegated a particular CRM action."},{"text":"Whether the assistant authenticates users before allowing them to open a chat","why":"Chat authentication alone is insufficient to bind authorization to individual CRM records and operations."}],"takeaway":"Specify acting principal and delegation semantics for every tool.","source":"mcp"},{"id":"af68b16b4f44","domain":"Identity and authorization","level":"E","stem":"A service accepts an OAuth access token issued for a different API. What is the core flaw?","choices":[{"text":"Missing token audience validation at the receiving resource","why":"Valid signature alone does not make a token intended for this service"},{"text":"A signed token with valid scopes is sufficient without checking audience","why":"Scopes alone do not make a token intended for the resource"},{"text":"The client received a token through a secure OAuth flow","why":"Correct issuance does not excuse the resource server from validating audience"},{"text":"An expired vector index","why":"Retrieval state does not change token audience"}],"takeaway":"Check audience, issuer, scopes and token context at each protected resource.","source":"mcp"},{"id":"24f2ad015ad9","domain":"Identity and authorization","level":"A","stem":"An agent with read-only UI features writes records through a shared service account. What should you investigate?","choices":[{"text":"Effective write permissions of the shared service identity","why":"UI descriptions can hide backend overprivilege"},{"text":"The model's explanation style","why":"Wording is not the source of write authority"},{"text":"Whether the chat UI disabled the write button","why":"Frontend restrictions cannot remove a service account's backend capability"},{"text":"Whether the original user consent included read-only access","why":"User consent cannot constrain an overprivileged shared service credential by itself"}],"takeaway":"Audit the credentials actually used by the tool execution path.","source":"mcp"},{"id":"b16999eeef93","domain":"Identity and authorization","level":"A","stem":"A delegated token for a calendar server is forwarded unchanged to an unrelated task service. What risk is most precise?","choices":[{"text":"Token audience mismatch and confused-deputy risk","why":"An untrusted resource may misuse an overly portable bearer token"},{"text":"All delegation necessarily requires administrator passwords","why":"OAuth permits scoped delegation without sharing passwords"},{"text":"TLS automatically rebinds the token to the new service","why":"Transport encryption is not audience binding"},{"text":"A token issued to an agent can never be revoked","why":"Revocation and expiry depend on design"}],"takeaway":"Give each resource a correctly scoped, audience-bound token.","source":"mcp"},{"id":"542d0dae61b6","domain":"Identity and authorization","level":"D","stem":"A procurement agent needs to read purchase orders and submit low-value approvals. Which authorization model is strongest?","choices":[{"text":"Dedicated agent credentials with bounded user delegation","why":"Agent identity, human authority and transaction conditions remain distinct"},{"text":"Reuse the CFO's permanent admin credentials","why":"This gives far more authority than required"},{"text":"Pass user names in natural-language tool parameters only","why":"Text labels do not prove identity"},{"text":"Allow any tool once the user has authenticated to the chat","why":"Chat authentication is not authorization for every operation"}],"takeaway":"Authorize each action against both principal and business context.","source":"mcp"},{"id":"2ca16c0a1ced","domain":"Identity and authorization","level":"D","stem":"An internal MCP server fronts a payroll API. How should OAuth be implemented?","choices":[{"text":"Validate token audiences and scopes at resource boundaries","why":"Each service has its own trust and audience boundary"},{"text":"Accept any signed company token for convenience","why":"Signatures do not establish intended audience"},{"text":"Have the model decide whether a scope is sufficient","why":"Authorization must be deterministic"},{"text":"Use one static shared API key for every employee","why":"Shared identity loses attribution and least privilege"}],"takeaway":"Use audience-bound access tokens and server-side policy checks.","source":"mcp"},{"id":"f61b380a037c","domain":"Identity and authorization","level":"V","stem":"A client asks whether its agents have 'least privilege.' Which evidence is most persuasive?","choices":[{"text":"Tests of who can use each tool","why":"Effective rights and paths matter more than declarative intent"},{"text":"A written statement that agents use SSO","why":"SSO alone does not constrain permissions"},{"text":"A screenshot of a consent screen","why":"Consent is not proof of backend scope"},{"text":"A list of model providers","why":"Provider choice does not prove authorization"}],"takeaway":"Prove minimum rights at the resources where effects happen.","source":"mcp"},{"id":"0d79f45ca8b2","domain":"Identity and authorization","level":"V","stem":"A high-severity finding involves an overprivileged agent principal. What remediation is most durable?","choices":[{"text":"Replace broad credentials with scoped identities and regression tests for required workflows","why":"Reduces blast radius while preserving use cases"},{"text":"Rotate the current secret monthly and shorten access-token expiration times","why":"Rotation reduces credential lifetime but preserves overbroad authorized reach."},{"text":"Require a second model to review each tool invocation before the existing principal executes","why":"Model review is not an authorization boundary, and the principal remains overprivileged."},{"text":"Apply a network egress allowlist while retaining the broad API scope","why":"Network controls constrain destinations but not which permitted records or actions the principal can modify."}],"takeaway":"Eliminate reachability to unnecessary actions and prove normal flow still works.","source":"mcp"},{"id":"ccc6143a9d46","domain":"Agents, tools and MCP","level":"E","stem":"What security property does MCP by itself NOT provide?","choices":[{"text":"MCP does not decide if a given tool action is allowed","why":"A protocol helps interaction but does not decide enterprise policy"},{"text":"Server-side JSON schema validation for exposed tool argument structures","why":"MCP describes capability interfaces; schema checking depends on implementation but is not the key missing business decision."},{"text":"An authenticated connection between a tool client and a protected resource","why":"A deployment can add authentication, but that is not authorization for a model-selected transaction."},{"text":"Protocol support for enumerating available tools and resources","why":"Tool discovery is part of the interaction model; it does not decide if a user may authorize a tool's business effect."}],"takeaway":"Do not conflate a tool protocol with a policy engine.","source":"mcp"},{"id":"37fcd49fdb9d","domain":"Agents, tools and MCP","level":"E","stem":"Why are agent skills and tool descriptions potential attack surfaces?","choices":[{"text":"Untrusted component instructions can influence model tool behavior","why":"Capability metadata influences choices and arguments"},{"text":"Descriptions are executed as native machine code by default","why":"The usual issue is model interpretation, not direct execution"},{"text":"Tools cannot operate unless the user manually clicks every token","why":"Agents may invoke authorized tools programmatically"},{"text":"A model cannot reason about tool descriptions","why":"Descriptions explicitly guide tool use"}],"takeaway":"Treat dynamically loaded context and capabilities as supply-chain inputs.","
